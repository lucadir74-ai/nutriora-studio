<script type="module">
import { html, render, useState, useEffect, useMemo } from 'https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.module.js';
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ====================================================================
//  CONFIGURAZIONE: incolla qui i due valori presi da Supabase
//  del progetto Supabase "finanze" (Project URL e chiave publishable).
//  Le tabelle di Finanze stanno nello schema separato "finanze".
// ====================================================================
const SUPABASE_URL = 'https://rjagrchuikdkmhpieaqj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_dkd-ZmZt8LkvFx86VWTgmQ_D8QFJewS';
// ====================================================================

const CONFIGURED = /^https:\/\//.test(SUPABASE_URL) && SUPABASE_ANON_KEY.length > 30;
const sb = CONFIGURED ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: 'finanze' }, auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'finanze-auth' } }) : null;

// ---------- utilità ----------
const $eur = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' });
const eur = v => $eur.format(Number(v) || 0);
const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayIso = () => isoDate(new Date());
const ymOf = s => String(s).slice(0, 7);
const MONTHS = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const MSHORT = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const monthLabel = ym => { const [y, m] = ym.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };
const addMonths = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const daysIn = (y, m) => new Date(y, m, 0).getDate();
const dayLabel = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' }); };
const shortDate = iso => { const [y, m, d] = iso.split('-').map(Number); return `${d} ${MSHORT[m - 1]} ${y}`; };
const parseAmt = s => { s = String(s ?? '').trim().replace(/[\s€]/g, ''); if (!s) return NaN; if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); else if (/^-?[1-9]\d{0,2}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); return Number(s); };
const round2 = v => Math.round((Number(v) + Number.EPSILON) * 100) / 100;
const fmtIn = v => (v === null || v === undefined || v === '') ? '' : String(v).replace('.', ',');
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2));
const lsGet = k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
const live = o => Object.values(o || {}).filter(x => !x.deleted);
const bySort = (a, b) => (a.sort ?? 0) - (b.sort ?? 0) || String(a.name).localeCompare(String(b.name), 'it');
const COLORS = ['#1B7A51','#2F6FB3','#C8661B','#94650F','#8A3FA0','#B0392F','#23857F','#5B6B2E','#C04A7A','#4B5563'];
const SCOPES = { pro: 'Lavoro', personal: 'Personale', tax: 'Tasse e contributi' };

// ---------- modello dati ----------
const TABLES = ['accounts', 'categories', 'transactions', 'recurring'];
const COLS = {
  accounts: { user_id: null, id: null, name: '', icon: null, color: null, initial_balance: 0, sort: 0, archived: false, deleted: false },
  categories: { user_id: null, id: null, name: '', kind: 'expense', scope: 'personal', color: null, sort: 0, archived: false, deleted: false },
  transactions: { user_id: null, id: null, date: null, kind: 'expense', amount: 0, account_id: null, to_account_id: null, category_id: null, note: null, invoiced: false, pos: false, pos_pct: null, pos_fixed: null, pos_fee: null, recurring_id: null, tax_year: null, tax_part: null, deleted: false },
  recurring: { user_id: null, id: null, kind: 'expense', amount: 0, account_id: null, to_account_id: null, category_id: null, note: null, freq: 'monthly', day: 1, month: null, start_date: null, auto: true, active: true, invoiced: false, deleted: false },
};
const clean = (t, r) => { const o = {}; for (const [c, def] of Object.entries(COLS[t])) o[c] = r[c] === undefined ? def : r[c]; return o; };
const emptyData = () => ({ accounts: {}, categories: {}, transactions: {}, recurring: {}, settings: {} });

// Effetto di un movimento sui saldi dei conti
function effects(t) {
  const a = Number(t.amount) || 0, fee = Number(t.pos_fee) || 0;
  if (t.kind === 'income') return [[t.account_id, a - fee]];
  if (t.kind === 'expense') return [[t.account_id, -a]];
  if (t.kind === 'transfer') return [[t.account_id, -a], [t.to_account_id, a]];
  return [];
}
function balances(d) {
  const b = {};
  for (const a of live(d.accounts)) b[a.id] = Number(a.initial_balance) || 0;
  for (const t of live(d.transactions)) for (const [acc, v] of effects(t)) if (acc in b) b[acc] = round2(b[acc] + v);
  return b;
}

// ---------- ricorrenti ----------
function occurrences(r, until) {
  const out = []; if (!r.start_date) return out;
  const start = r.start_date; let [y, m] = start.split('-').map(Number); const day = Number(r.day) || 1;
  if (r.freq === 'yearly') {
    const mm = Number(r.month) || m;
    for (let i = 0; i < 80; i++, y++) { const d = `${y}-${pad(mm)}-${pad(Math.min(day, daysIn(y, mm)))}`; if (d > until) break; if (d >= start) out.push(d); }
  } else {
    for (let i = 0; i < 400; i++) { const d = `${y}-${pad(m)}-${pad(Math.min(day, daysIn(y, m)))}`; if (d > until) break; if (d >= start) out.push(d); m++; if (m > 12) { m = 1; y++; } }
  }
  return out;
}
const occKey = (r, date) => `r:${r.id}:${r.freq === 'yearly' ? date.slice(0, 4) : date.slice(0, 7)}`;
function nextOccurrence(r, after) {
  const until = `${Number(after.slice(0, 4)) + 3}-12-31`;
  return occurrences(r, until).find(d => d > after) || null;
}
function pendingReminders(d) {
  const today = todayIso(), from = isoDate(new Date(Date.now() - 400 * 864e5)), out = [];
  for (const r of live(d.recurring)) {
    if (r.auto || !r.active) continue;
    for (const date of occurrences(r, today)) { if (date < from) continue; const id = occKey(r, date); if (!d.transactions[id]) out.push({ r, date, id }); }
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
const isAdj = t => String(t.id).startsWith('adj:');
const txFromRec = (r, date, id) => ({ id, date, kind: r.kind, amount: r.amount, account_id: r.account_id, to_account_id: r.kind === 'transfer' ? r.to_account_id : null, category_id: r.kind === 'transfer' ? null : r.category_id, note: r.note, invoiced: r.kind === 'income' && !!r.invoiced, recurring_id: r.id, deleted: false });

// ====================================================================
//  STORE: copia locale + coda di invio + sincronizzazione con Supabase
// ====================================================================
function createStore(uid) {
  const kC = 'fz2:cache:' + uid, kQ = 'fz2:queue:' + uid, kS = 'fz2:snap:' + uid;
  let data = lsGet(kC) || emptyData();
  for (const t of TABLES) data[t] = data[t] || {};
  data.settings = data.settings || {};
  let queue = lsGet(kQ) || [];
  const st = { loaded: false, syncing: false, flushing: false, error: null, online: navigator.onLine, lastPull: 0, cacheOk: true, version: 0 };
  const subs = new Set();
  const emit = () => { st.version++; subs.forEach(f => f()); };
  const persist = () => { const a = lsSet(kC, data), b = lsSet(kQ, queue); st.cacheOk = a && b; };
  const enqueue = (table, id, row) => { queue = queue.filter(q => !(q.table === table && q.id === id)); queue.push({ table, id, row }); };
  let noTaxCols = false;
  let timer = null; const schedule = () => { clearTimeout(timer); timer = setTimeout(flush, 350); };

  function upsertMany(table, rows) {
    const now = new Date().toISOString();
    for (const row of rows) { const r = { ...clean(table, row), user_id: uid, updated_at: now }; data[table][r.id] = r; enqueue(table, r.id, r); }
    persist(); emit(); schedule();
  }
  const upsert = (table, row) => upsertMany(table, [row]);
  function setSettings(patch) {
    data.settings = { ...data.settings, ...patch };
    enqueue('settings', 'settings', { data: data.settings }); persist(); emit(); schedule();
  }

  async function flush() {
    if (st.flushing || !queue.length || !sb) return;
    st.flushing = true; emit();
    try {
      while (queue.length) {
        const first = queue[0];
        if (first.table === 'settings') {
          const { error } = await sb.from('settings').upsert({ user_id: uid, data: first.row.data }, { onConflict: 'user_id' });
          if (error) throw error;
          queue = queue.filter(q => q !== first);
        } else {
          const batch = [];
          for (const q of queue) { if (q.table !== first.table || batch.length >= 300) break; batch.push(q); }
          const rows = batch.map(q => { const r = clean(q.table, q.row); r.user_id = uid; if (noTaxCols && q.table === 'transactions') { delete r.tax_year; delete r.tax_part; } return r; });
          const { error } = await sb.from(first.table).upsert(rows, { onConflict: 'user_id,id' });
          if (error && !noTaxCols && first.table === 'transactions' && /tax_(year|part)/.test(error.message || '')) { noTaxCols = true; continue; }
          if (error) throw error;
          const sent = new Set(batch); queue = queue.filter(q => !sent.has(q));
        }
        persist(); emit();
      }
      st.error = null;
    } catch (e) {
      st.error = navigator.onLine ? 'Salvataggio sul server non riuscito: ' + (e.message || e) + '. I dati restano sul dispositivo e verranno inviati al prossimo tentativo.' : null;
    } finally { st.flushing = false; persist(); emit(); }
  }

  async function fetchAll(table) {
    let out = [], from = 0; const size = 1000;
    for (;;) {
      const { data: rows, error } = await sb.from(table).select('*').order('id').range(from, from + size - 1);
      if (error) throw error;
      out = out.concat(rows); if (rows.length < size) break; from += size;
    }
    return out;
  }
  async function pull() {
    if (!sb || st.syncing) return;
    st.syncing = true; emit();
    const started = new Date(Date.now() - 2000).toISOString();
    try {
      const fresh = emptyData();
      for (const t of TABLES) for (const r of await fetchAll(t)) fresh[t][r.id] = r;
      const { data: s, error } = await sb.from('settings').select('data').maybeSingle();
      if (error) throw error;
      fresh.settings = s?.data || {};
      // modifiche fatte durante lo scaricamento: vincono quelle locali
      for (const t of TABLES) for (const r of Object.values(data[t])) if (r.updated_at && r.updated_at >= started) fresh[t][r.id] = r;
      for (const q of queue) { if (q.table === 'settings') fresh.settings = q.row.data; else fresh[q.table][q.id] = q.row; }
      data = fresh; st.loaded = true; st.error = null; st.lastPull = Date.now(); persist();
    } catch (e) {
      st.error = 'Non riesco a scaricare i dati dal server (' + (e.message || e) + '). Stai vedendo la copia salvata su questo dispositivo.';
    } finally { st.syncing = false; emit(); }
    flush();
  }

  function applyRecurring() {
    const today = todayIso(), rows = [];
    for (const r of live(data.recurring)) {
      if (!r.auto || !r.active) continue;
      for (const date of occurrences(r, today)) { const id = occKey(r, date); if (!data.transactions[id]) rows.push(txFromRec(r, date, id)); }
    }
    if (rows.length) upsertMany('transactions', rows);
  }

  function exportObj() {
    const o = { app: 'finanze2', v: 1, ts: new Date().toISOString(), data: { settings: data.settings } };
    for (const t of TABLES) o.data[t] = Object.values(data[t]);
    return o;
  }
  async function snapshot(force) {
    if (!sb) return false;
    const d = todayIso();
    if (!force && lsGet(kS) === d) return true;
    if (!force && !Object.keys(data.transactions).length) return true;
    const { error } = await sb.from('snapshots').insert({ user_id: uid, data: exportObj() });
    if (error) throw error;
    lsSet(kS, d); return true;
  }

  const onOnline = () => { st.online = true; emit(); flush(); if (Date.now() - st.lastPull > 60000) pull(); };
  const onOffline = () => { st.online = false; emit(); };
  const onVis = () => { if (document.visibilityState === 'visible') { if (Date.now() - st.lastPull > 60000) pull().then(afterLoad); else flush(); } };
  let iv = null;
  async function afterLoad() { if (st.loaded) { applyRecurring(); try { await snapshot(false); } catch {} } }

  return {
    get data() { return data; }, st, get pending() { return queue.length; },
    subscribe(f) { subs.add(f); return () => subs.delete(f); },
    upsert, upsertMany, setSettings, flush, pull, applyRecurring, exportObj, snapshot,
    start() {
      navigator.storage?.persist?.().catch(() => {});
      addEventListener('online', onOnline); addEventListener('offline', onOffline); document.addEventListener('visibilitychange', onVis);
      iv = setInterval(() => { if (queue.length) flush(); }, 30000);
      pull().then(afterLoad);
    },
    stop() { removeEventListener('online', onOnline); removeEventListener('offline', onOffline); document.removeEventListener('visibilitychange', onVis); clearInterval(iv); },
  };
}

};
const OLD_SINGLE = { tax_irpef: 'Imposta sostitutiva', tax_enpab: 'ENPAB', tax_bollo: 'Imposta di bollo' };
const OLD_ACC = { fineco: ['Fineco', '🏦', '#1B7A51'], ing: ['ING', '🏦', '#C8661B'], contanti: ['Contanti', '💶', '#94650F'] };

function convertOld(d) {
  const cats = {}, accs = {}; let ci = 0;
  const catFor = (type, sub) => {
    sub = sub || 'altro';
    if (OLD_SINGLE[type]) {
      const id = 'imp-cat:' + type;
      cats[id] = cats[id] || { id, name: OLD_SINGLE[type], kind: 'expense', scope: 'tax', color: COLORS[3], sort: 900 + ci++ };
      return { id, prefix: OLD_SUB[type]?.[sub] || '' };
    }
    const isIn = String(type).startsWith('income');
    const grp = isIn ? 'income' : (OLD_SUB[type] ? type : 'expense_personal');
    const id = `imp-cat:${grp}:${sub}`;
    const name = isIn ? (OLD_SUB.income_fatturato[sub] || OLD_SUB.income_non_fatt[sub] || (sub === 'altro' ? 'Altre entrate' : sub)) : (OLD_SUB[grp][sub] || sub);
    const scope = isIn || grp === 'expense_professional' || grp === 'annual' ? 'pro' : 'personal';
    cats[id] = cats[id] || { id, name, kind: isIn ? 'income' : 'expense', scope, color: COLORS[ci % COLORS.length], sort: ci++ };
    return { id, prefix: '' };
  };
  const accFor = conto => {
    const k = conto || 'contanti', id = 'imp-acc:' + k;
    if (!accs[id]) { const [n, ic, c] = OLD_ACC[k] || [k, '🏦', COLORS[Object.keys(accs).length % COLORS.length]]; accs[id] = { id, name: n, icon: ic, color: c, initial_balance: Number(d.initBal?.[k]) || 0, sort: Object.keys(accs).length }; }
    return id;
  };
  for (const k of Object.keys(OLD_ACC)) accFor(k);
  const txs = [], recs = []; let skipped = 0;
  for (const t of d.txs || []) {
    const date = String(t.date || '').slice(0, 10), amt = Number(t.amount);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !(amt >= 0)) { skipped++; continue; }
    const c = catFor(t.txType, t.subcat);
    const note = [c.prefix, t.note || t.description].filter(Boolean).join(', ') || null;
    txs.push({ id: 'imp:' + t.id, date, kind: String(t.txType).startsWith('income') ? 'income' : 'expense', amount: round2(amt), account_id: accFor(t.conto), category_id: c.id, note, invoiced: t.txType === 'income_fatturato', deleted: false });
  }
  const today = todayIso();
  for (const r of d.rec || []) {
    const c = catFor(r.txType, r.subcat), day = Math.min(31, Math.max(1, Number(r.dayOfMonth) || 1));
    const lastYm = /^\d{4}-\d{2}/.test(r.lastApplied || '') ? String(r.lastApplied).slice(0, 7) : ymOf(today);
    const ym = addMonths(lastYm, 1), [y, m] = ym.split('-').map(Number);
    recs.push({ id: 'imp-rec:' + r.id, kind: String(r.txType).startsWith('income') ? 'income' : 'expense', amount: round2(Number(r.amount) || 0), account_id: accFor(r.conto), category_id: c.id, note: [c.prefix, r.note].filter(Boolean).join(', ') || null, freq: 'monthly', day, start_date: `${ym}-${pad(Math.min(day, daysIn(y, m)))}`, auto: true, active: r.active !== false, invoiced: r.txType === 'income_fatturato' });
  }
  for (const a of d.ann || []) {
    const due = String(a.dueDate || '').slice(0, 10); if (!/^\d{4}-\d{2}-\d{2}$/.test(due)) { skipped++; continue; }
    const c = catFor(a.txType || 'annual', a.subcat), [, m, dd] = due.split('-').map(Number);
    recs.push({ id: 'imp-ann:' + (a.id || due + a.subcat), kind: 'expense', amount: round2(Number(a.amount) || 0), account_id: accFor(a.conto), category_id: c.id, note: a.description || null, freq: 'yearly', day: dd, month: m, start_date: due, auto: false, active: a.active !== false });
  }
  return { accounts: Object.values(accs), categories: Object.values(cats), transactions: txs, recurring: recs, skipped };
}

function importJson(store, j) {
  if (j && j.app === 'finanze2' && j.data) {
    for (const t of TABLES) if (Array.isArray(j.data[t]) && j.data[t].length) store.upsertMany(t, j.data[t]);
    if (j.data.settings && Object.keys(j.data.settings).length) store.setSettings(j.data.settings);
    return `Ripristinati ${j.data.transactions?.length || 0} movimenti, ${j.data.accounts?.length || 0} conti e ${j.data.categories?.length || 0} voci.`;
  }
  let d = j && j.data ? j.data : j;
  if (d && d['fin3:txs'] !== undefined) {
    const P = x => { try { return typeof x === 'string' ? JSON.parse(x) : x; } catch { return null; } };
    d = { txs: P(d['fin3:txs']) || [], rec: P(d['fin3:rec']) || [], ann: P(d['fin3:ann']) || [], initBal: P(d['fin3:initBal']) };
  }
  if (!d || !Array.isArray(d.txs)) throw new Error('File non riconosciuto. Scegli un backup esportato da Finanze.');
  const c = convertOld(d);
  store.upsertMany('accounts', c.accounts); store.upsertMany('categories', c.categories);
  if (c.transactions.length) store.upsertMany('transactions', c.transactions);
  if (c.recurring.length) store.upsertMany('recurring', c.recurring);
  return `Importati ${c.transactions.length} movimenti, ${c.recurring.length} ricorrenti e ${c.accounts.length} conti.` + (c.skipped ? ` ${c.skipped} righe scartate perché senza data valida.` : '');
}

async function shareOrDownload(obj, name) {
  const text = JSON.stringify(obj, null, 1);
  try {
    const file = new File([text], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
const readFileJson = file => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => { try { res(JSON.parse(r.result)); } catch { rej(new Error('Il file non è un backup valido.')); } }; r.onerror = () => rej(new Error('Lettura del file non riuscita.')); r.readAsText(file); });

function Sheet({ title, onClose, children }) {
  useEffect(() => { const k = e => e.key === 'Escape' && onClose(); addEventListener('keydown', k); const o = document.body.style.overflow; document.body.style.overflow = 'hidden'; return () => { removeEventListener('keydown', k); document.body.style.overflow = o; }; }, []);
  return html`<div class="ov" onClick=${onClose}><div class="sheet" role="dialog" aria-modal="true" aria-label=${title} onClick=${e => e.stopPropagation()}>
    <div class="sh-h"><h2>${title}</h2><button class="x" onClick=${onClose} aria-label="Chiudi">✕</button></div>${children}</div></div>`;
}

function SyncPill({ store }) {
  const st = store.st, n = store.pending;
  if (st.error) return html`<button class="pill err" onClick=${() => alert(st.error)}>Non salvato, tocca</button>`;
  if (!st.online) return html`<span class="pill warn">${n ? `Offline, ${n} da inviare` : 'Offline'}</span>`;
  if (n || st.flushing) return html`<span class="pill">Salvataggio…</span>`;
  if (st.syncing) return html`<span class="pill">Aggiornamento…</span>`;
  if (!st.cacheOk) return html`<span class="pill warn">Salvato solo online</span>`;
  return html`<span class="pill ok">Salvato</span>`;
}

function AmountField({ value, onInput, label = 'Importo', big }) {
  return html`<label class="f"><span>${label}</span><input class=${'i num' + (big ? ' big' : '')} inputmode="decimal" placeholder="0,00" value=${value} onInput=${e => onInput(e.target.value)} /></label>`;
}

function CategoryPicker({ store, kind, value, onPick }) {
  const cats = live(store.data.categories).filter(c => c.kind === kind && (!c.archived || c.id === value)).sort(bySort);
  const groups = kind === 'income' ? [['pro', 'Lavoro'], ['personal', 'Personale']] : [['pro', 'Lavoro'], ['personal', 'Personale'], ['tax', 'Tasse e contributi']];
  const addNew = () => {
    const name = prompt('Nome della nuova voce'); if (!name || !name.trim()) return;
    let scope = 'pro';
    if (kind !== 'income') { const ch = prompt('Di che tipo è?\n1 = Lavoro\n2 = Personale\n3 = Tasse e contributi', '1'); if (ch === null) return; scope = ch.trim() === '2' ? 'personal' : ch.trim() === '3' ? 'tax' : 'pro'; }
    const id = uuid(); store.upsert('categories', { id, name: name.trim(), kind, scope, color: COLORS[cats.length % COLORS.length], sort: 500 + cats.length }); onPick(id);
  };
  return html`<div>${groups.map(([s, l]) => { const g = cats.filter(c => (c.scope || 'personal') === s); return g.length ? html`<div class="grp">${l}</div><div class="chips">${g.map(c => html`<button type="button" class=${'chip' + (c.id === value ? ' on' : '')} onClick=${() => onPick(c.id)}><i class="dot" style=${'--c:' + (c.color || '#999')}></i>${c.name}</button>`)}</div>` : null; })}
    <div class="chips" style="margin-top:10px"><button type="button" class="chip add" onClick=${addNew}>+ Nuova voce</button></div></div>`;
}

function AccountSelect({ store, value, onChange, exclude, label = 'Conto' }) {
  const accs = live(store.data.accounts).filter(a => (!a.archived || a.id === value) && a.id !== exclude).sort(bySort);
  return html`<label class="f"><span>${label}</span><select class="i" value=${value} onChange=${e => onChange(e.target.value)}>
    <option value="" disabled>Scegli un conto</option>${accs.map(a => html`<option value=${a.id}>${(a.icon ? a.icon + ' ' : '') + a.name}</option>`)}</select></label>`;
}

function KindSeg({ kind, setKind }) {

}

// ---------- modulo movimento ----------
function TxForm({ store, tx, onClose }) {
  const d = store.data, s = d.settings, isNew = !tx.id;
  const firstAcc = live(d.accounts).filter(a => !a.archived).sort(bySort)[0]?.id || '';
  const [kind, setKind] = useState(tx.kind || 'expense');
  const [amount, setAmount] = useState(fmtIn(tx.amount));
  const [date, setDate] = useState(tx.date || todayIso());
  const [acc, setAcc] = useState(tx.account_id || (d.accounts[s.last_account] && !d.accounts[s.last_account].deleted ? s.last_account : firstAcc));
  const [toAcc, setToAcc] = useState(tx.to_account_id || '');
  const [cat, setCat] = useState(tx.category_id || '');
  const [note, setNote] = useState(tx.note || '');
  const [invoiced, setInvoiced] = useState(tx.invoiced ?? !!s.default_invoiced);
  const [pos, setPos] = useState(!!tx.pos);
  const [posPct, setPosPct] = useState(fmtIn(tx.pos_pct ?? s.pos_pct ?? ''));
  const [posFixed, setPosFixed] = useState(fmtIn(tx.pos_fixed ?? s.pos_fixed ?? ''));
  const [err, setErr] = useState('');
  const [taxPart, setTaxPart] = useState(tx.tax_part || 'acconto');
  const [taxYear, setTaxYear] = useState(tx.tax_year ? String(tx.tax_year) : '');
  useEffect(() => { const c = d.categories[cat]; if (c && c.kind !== kind) setCat(''); }, [kind]);
  const isTaxCat = kind === 'expense' && d.categories[cat]?.scope === 'tax';
  const defYear = p => String(Number((date || todayIso()).slice(0, 4)) - (p === 'saldo' ? 1 : 0));
  const a = parseAmt(amount), pct = parseAmt(posPct) || 0, fix = parseAmt(posFixed) || 0;
  const fee = kind === 'income' && pos && a > 0 ? round2(a * pct / 100 + fix) : 0;

  const save = () => {
    if (!(a > 0)) return setErr('Inserisci un importo maggiore di zero.');
    if (!acc) return setErr('Scegli il conto.');
    if (kind === 'transfer' && (!toAcc || toAcc === acc)) return setErr('Scegli un conto di destinazione diverso da quello di partenza.');
    if (kind !== 'transfer' && !cat && !isAdj(tx)) return setErr('Scegli una voce.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return setErr('Inserisci una data valida.');
    const isPos = kind === 'income' && pos;
    store.upsert('transactions', { ...tx, id: tx.id || uuid(), date, kind, amount: round2(a), account_id: acc, to_account_id: kind === 'transfer' ? toAcc : null, category_id: kind === 'transfer' ? null : cat, note: note.trim() || null, invoiced: kind === 'income' && invoiced, pos: isPos, pos_pct: isPos ? pct : null, pos_fixed: isPos ? fix : null, pos_fee: isPos ? fee : null, tax_part: isTaxCat ? taxPart : null, tax_year: isTaxCat ? (Number(taxYear) || Number(defYear(taxPart))) : null, deleted: false });
    const patch = {}; if (s.last_account !== acc) patch.last_account = acc; if (kind === 'income' && s.default_invoiced !== invoiced) patch.default_invoiced = invoiced;
    if (Object.keys(patch).length) store.setSettings(patch);
    onClose();
  };
  const del = () => { if (confirm('Spostare questo movimento nel cestino? Potrai ripristinarlo dalle impostazioni.')) { store.upsert('transactions', { ...tx, deleted: true }); onClose(); } };

  return html`<${Sheet} title=${isNew ? 'Nuovo movimento' : 'Modifica movimento'} onClose=${onClose}>
    <div style="margin-top:10px"><${KindSeg} kind=${kind} setKind=${setKind} /></div>
    <${AmountField} big value=${amount} onInput=${setAmount} label=${kind === 'income' && pos ? 'Importo pagato dal cliente' : 'Importo'} />
    ${kind === 'income' && html`<label class="check"><input type="checkbox" checked=${pos} onChange=${e => setPos(e.target.checked)} />Incassato con POS</label>
      ${pos && html`<div class="two"><${AmountField} label="Commissione %" value=${posPct} onInput=${setPosPct} /><${AmountField} label="Costo fisso (€)" value=${posFixed} onInput=${setPosFixed} /></div>
        <div class="calc num">Commissione ${eur(fee)}, accreditato sul conto ${eur(a > 0 ? a - fee : 0)}</div>
        ${!s.pos_pct && html`<p class="hint">Puoi salvare la tua commissione abituale nelle impostazioni, così la trovi già compilata.</p>`}`}`}
    <div class="two"><label class="f"><span>Data</span><input class="i" type="date" value=${date} onInput=${e => setDate(e.target.value)} /></label>
      <${AccountSelect} store=${store} value=${acc} onChange=${setAcc} label=${kind === 'transfer' ? 'Da conto' : 'Conto'} /></div>
    ${kind === 'transfer' ? html`<${AccountSelect} store=${store} value=${toAcc} onChange=${setToAcc} exclude=${acc} label="A conto" />`
      : html`<div class="f" style="margin-top:14px"><span style="font-size:.82rem;color:var(--muted);font-weight:600">Voce</span><${CategoryPicker} store=${store} kind=${kind} value=${cat} onPick=${setCat} /></div>`}
    ${kind === 'income' && html`<label class="check"><input type="checkbox" checked=${invoiced} onChange=${e => setInvoiced(e.target.checked)} />Con fattura</label>`}
    ${isTaxCat && html`<label class="f"><span>Questo versamento è</span><div class="seg">${[['acconto', 'Acconto'], ['saldo', 'Saldo'], ['altro', 'Altro']].map(([k, l]) => html`<button type="button" class=${taxPart === k ? 'on' : ''} onClick=${() => setTaxPart(k)}>${l}</button>`)}</div></label>
      <label class="f"><span>Anno dei redditi a cui si riferisce</span><input class="i num" inputmode="numeric" value=${taxYear || defYear(taxPart)} onInput=${e => setTaxYear(e.target.value)} /></label>
      <p class="hint">Esempio: a giugno 2026 il saldo è per i redditi 2025, gli acconti per i redditi 2026.</p>`}
    <label class="f"><span>Nota (facoltativa)</span><input class="i" value=${note} onInput=${e => setNote(e.target.value)} placeholder="Es. nome paziente, negozio…" /></label>
    ${err && html`<div class="err" role="alert">${err}</div>`}

// ---------- vista movimenti ----------
function Movements({ store, openTx, goTab, init }) {
  const d = store.data;
  const [ym, setYm] = useState(init?.ym || ymOf(todayIso()));
  const [mode, setMode] = useState(init?.mode || 'month');
  const [fAcc, setFAcc] = useState('');
  const [fCat, setFCat] = useState(init?.cat || '');
  const year = ym.slice(0, 4);
  const inPeriod = t => mode === 'month' ? ymOf(t.date) === ym : t.date.startsWith(year);
  const catOk = t => !fCat || (fCat === '_none' ? (t.kind !== 'transfer' && !isAdj(t) && !t.category_id) : fCat === '_pos' ? +(t.pos_fee || 0) > 0 : t.category_id === fCat);
  const periodLabel = mode === 'month' ? monthLabel(ym) : 'Anno ' + year;
  const bal = useMemo(() => balances(d), [store.st.version]);
  const accs = live(d.accounts).filter(a => !a.archived || Math.abs(bal[a.id] || 0) > 0.004).sort(bySort);
  const total = Object.values(bal).reduce((x, y) => x + y, 0);
  const reminders = useMemo(() => [...pendingReminders(d), ...taxWindows(d).due], [store.st.version]);
  const txs = useMemo(() => live(d.transactions).filter(t => inPeriod(t) && (!fAcc || t.account_id === fAcc || t.to_account_id === fAcc) && catOk(t))
    .sort((a, b) => b.date.localeCompare(a.date) || String(b.updated_at).localeCompare(String(a.updated_at))), [store.st.version, ym, mode, fAcc, fCat]);
  let inc = 0, exp = 0; for (const t of txs) { if (isAdj(t)) continue; if (t.kind === 'income') { inc += +t.amount; exp += +(t.pos_fee || 0); } else if (t.kind === 'expense') exp += +t.amount; }
  const days = []; for (const t of txs) { const last = days[days.length - 1]; if (last && last.date === t.date) last.items.push(t); else days.push({ date: t.date, items: [t] }); }
  const cats = live(d.categories).sort(bySort);

  return html`<div>
    <div class="worth"><div class="lbl">Patrimonio totale</div><div class="big num">${eur(total)}</div></div>
    <div class="accts">${accs.map(a => html`<button class=${'acct' + (fAcc === a.id ? ' on' : '')} style=${'--c:' + (a.color || '#888')} onClick=${() => setFAcc(fAcc === a.id ? '' : a.id)} aria-pressed=${fAcc === a.id}>
      <div class="n">${(a.icon ? a.icon + ' ' : '') + a.name}</div><div class="v num">${eur(bal[a.id])}</div></button>`)}</div>
    ${reminders.length > 0 && html`<button class="banner" onClick=${() => goTab('rec')}><span>${reminders.length === 1 ? '1 pagamento da registrare' : reminders.length + ' pagamenti da registrare'}</span><span>›</span></button>`}
    <div class="month"><button class="iconbtn" aria-label="Indietro" onClick=${() => setYm(addMonths(ym, mode === 'month' ? -1 : -12))}>‹</button><h2>${periodLabel}</h2><button class="iconbtn" aria-label="Avanti" onClick=${() => setYm(addMonths(ym, mode === 'month' ? 1 : 12))}>›</button></div>
    <div class="totals num"><div><small>Entrate</small><b class="in">${eur(inc)}</b></div><div><small>Uscite</small><b class="out">${eur(exp)}</b></div><div><small>Differenza</small><b>${eur(inc - exp)}</b></div></div>
    <div class="filters"><select aria-label="Filtra per voce" value=${fCat} onChange=${e => setFCat(e.target.value)}><option value="">Tutte le voci</option>${cats.map(c => html`<option value=${c.id}>${c.name}</option>`)}<option value="_none">Senza voce</option><option value="_pos">Commissioni POS</option></select>
      ${(fAcc || fCat || mode === 'year') && html`<button class="linkbtn" onClick=${() => { setFAcc(''); setFCat(''); setMode('month'); }}>Togli filtri</button>`}</div>
    ${mode === 'year' && html`<p class="hint">Stai vedendo tutto l’anno ${year}. <button class="linkbtn" onClick=${() => setMode('month')}>Mostra solo il mese</button></p>`}
    ${days.length === 0 ? html`<div class="empty" style="margin-top:12px">Nessun movimento in ${periodLabel}.<br/>Tocca “+ Movimento” per aggiungerne uno.</div>`
      : days.map(g => html`<div class="day">${dayLabel(g.date)}</div><div class="list">${g.items.map(t => html`<${TxRow} key=${t.id} store=${store} t=${t} onOpen=${openTx} />`)}</div>`)}
  </div>`;
}

// ---------- vista grafici ----------
function Bars({ rows, total, onPick }) {
  if (!rows.length) return html`<div class="empty">Nessun dato nel periodo.</div>`;
  const max = Math.max(...rows.map(r => r.v));
  return html`<div class="card bars">${rows.map(r => html`<button type="button" class="b" onClick=${() => onPick && onPick(r.id)} aria-label=${`${r.name}: ${eur(r.v)}. Apri i movimenti di questa voce`}><div class="l"><span>${r.name}</span><span class="num"><b>${eur(r.v)}</b> <span class="mut">${total ? Math.round(r.v / total * 100) : 0}%</span> <span class="mut">›</span></span></div>
    <div class="track"><div class="fill" style=${`--c:${r.color || '#888'};width:${max ? Math.max(2, r.v / max * 100) : 0}%`}></div></div></button>`)}</div>`;
}
function Charts({ store, goMov }) {
  const d = store.data;
  const [ym, setYm] = useState(ymOf(todayIso()));
  const [mode, setMode] = useState('month');
  const year = ym.slice(0, 4);
  const inPeriod = t => mode === 'month' ? ymOf(t.date) === ym : t.date.startsWith(year);
  const data = useMemo(() => {
    const ex = {}, inc = {}, scope = { pro: 0, personal: 0, tax: 0 }; let posFees = 0;
    for (const t of live(d.transactions)) {
      if (!inPeriod(t) || t.kind === 'transfer' || isAdj(t)) continue;
      const c = d.categories[t.category_id], key = t.category_id || '_none';
      if (t.kind === 'expense') { ex[key] = (ex[key] || 0) + +t.amount; scope[c?.scope || 'personal'] += +t.amount; }
      else { inc[key] = (inc[key] || 0) + +t.amount; if (t.pos_fee) { posFees += +t.pos_fee; scope.pro += +t.pos_fee; } }
    }
    const toRows = o => Object.entries(o).map(([id, v]) => ({ id, name: d.categories[id]?.name || 'Senza voce', color: d.categories[id]?.color, v: round2(v) })).sort((a, b) => b.v - a.v);
    const exRows = toRows(ex); if (posFees) { exRows.push({ id: '_pos', name: 'Commissioni POS', color: '#4B5563', v: round2(posFees) }); exRows.sort((a, b) => b.v - a.v); }
    const trend = []; for (let i = 11; i >= 0; i--) { const m = addMonths(ym, -i); let a = 0, b = 0; for (const t of live(d.transactions)) { if (ymOf(t.date) !== m || isAdj(t)) continue; if (t.kind === 'income') { a += +t.amount; b += +(t.pos_fee || 0); } else if (t.kind === 'expense') b += +t.amount; } trend.push({ m, a, b }); }
    return { exRows, inRows: toRows(inc), scope, trend };
  }, [store.st.version, ym, mode]);
  const exTot = data.exRows.reduce((s, r) => s + r.v, 0), inTot = data.inRows.reduce((s, r) => s + r.v, 0);
  const tmax = Math.max(1, ...data.trend.flatMap(x => [x.a, x.b]));
  const pick = id => goMov({ ym, mode, cat: id });
  return html`<div>
    <div class="seg" style="margin-top:6px"><button class=${mode === 'month' ? 'on' : ''} onClick=${() => setMode('month')}>Mese</button><button class=${mode === 'year' ? 'on' : ''} onClick=${() => setMode('year')}>Anno</button></div>
    <div class="month"><button class="iconbtn" aria-label="Indietro" onClick=${() => setYm(addMonths(ym, mode === 'month' ? -1 : -12))}>‹</button><h2>${mode === 'month' ? monthLabel(ym) : 'Anno ' + year}</h2><button class="iconbtn" aria-label="Avanti" onClick=${() => setYm(addMonths(ym, mode === 'month' ? 1 : 12))}>›</button></div>
    <div class="scope3 num"><div><small>Lavoro</small><b>${eur(data.scope.pro)}</b></div><div><small>Personale</small><b>${eur(data.scope.personal)}</b></div><div><small>Tasse e contr.</small><b class="tx">${eur(data.scope.tax)}</b></div></div>
    <div class="sec">Uscite per voce <span class="mut num" style="font-weight:500">${eur(exTot)}</span></div><${Bars} rows=${data.exRows} total=${exTot} onPick=${pick} />
    <div class="sec">Entrate per voce <span class="mut num" style="font-weight:500">${eur(inTot)}</span></div><${Bars} rows=${data.inRows} total=${inTot} onPick=${pick} />
    <p class="hint">Tocca una voce per vedere i suoi movimenti.</p>
    <div class="sec">Ultimi 12 mesi</div>
    <div class="card"><div class="trend">${data.trend.map(x => html`<button class=${'m' + (x.m === ym ? ' on' : '')} onClick=${() => { setMode('month'); setYm(x.m); }} aria-label=${`${monthLabel(x.m)}: entrate ${eur(x.a)}, uscite ${eur(x.b)}`}>
      <div class="pair"><i style=${`height:${x.a / tmax * 100}%;background:var(--in)`}></i><i style=${`height:${x.b / tmax * 100}%;background:var(--out)`}></i></div><small>${MSHORT[+x.m.slice(5) - 1]}</small></button>`)}</div>
      <div class="legend"><span><i style="background:var(--in)"></i>Entrate</span><span><i style="background:var(--out)"></i>Uscite</span></div></div>
  </div>`;
}

// ---------- ricorrenti ----------
function recText(r) {

}
function RecForm({ store, rec, onClose }) {
  const d = store.data, isNew = !rec.id, now = new Date();

  const [auto, setAuto] = useState(rec.auto ?? true);
  const [active, setActive] = useState(rec.active ?? true);
  const [invoiced, setInvoiced] = useState(!!rec.invoiced);
  const [err, setErr] = useState('');
  useEffect(() => { const c = d.categories[cat]; if (c && c.kind !== kind) setCat(''); }, [kind]);
  const save = () => {
    const a = parseAmt(amount), dd = Number(day);
    if (!(a > 0)) return setErr('Inserisci un importo maggiore di zero.');
    if (!acc) return setErr('Scegli il conto.');
    if (kind === 'transfer' && (!toAcc || toAcc === acc)) return setErr('Scegli un conto di destinazione diverso.');
    if (kind !== 'transfer' && !cat) return setErr('Scegli una voce.');
    if (!(dd >= 1 && dd <= 31)) return setErr('Il giorno deve essere tra 1 e 31.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(start)) return setErr('Inserisci una data di inizio valida.');
    store.upsert('recurring', { ...rec, id: rec.id || uuid(), kind, amount: round2(a), account_id: acc, to_account_id: kind === 'transfer' ? toAcc : null, category_id: kind === 'transfer' ? null : cat, note: note.trim() || null, freq, day: dd, month: freq === 'yearly' ? Number(month) : null, start_date: start, auto, active, invoiced: kind === 'income' && invoiced, deleted: false });
    store.applyRecurring(); onClose();
  };
  const del = () => { if (confirm('Eliminare questa ricorrenza? I movimenti già registrati restano.')) { store.upsert('recurring', { ...rec, deleted: true }); onClose(); } };
  return html`<${Sheet} title=${isNew ? 'Nuova ricorrenza' : 'Modifica ricorrenza'} onClose=${onClose}>

    ${kind === 'transfer' ? html`<${AccountSelect} store=${store} value=${toAcc} onChange=${setToAcc} exclude=${acc} label="A conto" />`
      : html`<div style="margin-top:14px"><span style="font-size:.82rem;color:var(--muted);font-weight:600">Voce</span><${CategoryPicker} store=${store} kind=${kind} value=${cat} onPick=${setCat} /></div>`}
    <div style="margin-top:16px" class="seg"><button class=${freq === 'monthly' ? 'on' : ''} onClick=${() => setFreq('monthly')}>Ogni mese</button><button class=${freq === 'yearly' ? 'on' : ''} onClick=${() => setFreq('yearly')}>Ogni anno</button></div>
    <div class="two"><label class="f"><span>Giorno</span><input class="i num" inputmode="numeric" value=${day} onInput=${e => setDay(e.target.value)} /></label>
      ${freq === 'yearly' ? html`<label class="f"><span>Mese</span><select class="i" value=${month} onChange=${e => setMonth(e.target.value)}>${MONTHS.map((m, i) => html`<option value=${i + 1}>${m}</option>`)}</select></label>`
        : html`<label class="f"><span>A partire dal</span><input class="i" type="date" value=${start} onInput=${e => setStart(e.target.value)} /></label>`}</div>
    ${freq === 'yearly' && html`<label class="f"><span>A partire dal</span><input class="i" type="date" value=${start} onInput=${e => setStart(e.target.value)} /></label>`}
    <div style="margin-top:16px" class="seg"><button class=${auto ? 'on' : ''} onClick=${() => setAuto(true)}>Registra da sola</button><button class=${!auto ? 'on' : ''} onClick=${() => setAuto(false)}>Solo promemoria</button></div>
    <p class="hint">${auto ? 'Il movimento viene aggiunto in automatico alla data prevista.' : 'Alla scadenza ti viene chiesto di registrarlo, così puoi correggere l’importo.'}</p>

    ${!isNew && html`<button class="btn danger" onClick=${del}>Elimina ricorrenza</button>`}
  <//>`;
}
function Recurring({ store, openRec, openPlan }) {

    ${reminders.length > 0 && html`<div class="list">${reminders.map(p => html`<div class="row" style="cursor:default">
      <i class="dot" style=${'--c:' + (d.categories[p.r.category_id]?.color || '#999')}></i>
      <div class="mid"><div class="t">${p.r.note || d.categories[p.r.category_id]?.name || 'Ricorrenza'}</div><div class="s">scadenza ${shortDate(p.date)}, ${eur(p.r.amount)}</div></div>
      <button class="chip" onClick=${() => register(p)}>Registra</button><button class="linkbtn" onClick=${() => skip(p)} aria-label="Ignora">Ignora</button></div>`)}</div>`}

    <div class="sec">Ricorrenze</div>
    ${recs.length === 0 ? html`<div class="empty">Aggiungi qui affitto, abbonamenti, stipendio o scadenze annuali come l’assicurazione.</div>`
      : html`<div class="list">${recs.map(r => { const c = d.categories[r.category_id], nx = r.active ? nextOccurrence(r, today) : null; return html`<button class="row" onClick=${() => openRec(r)}>

        <div class=${'amt num ' + (r.kind === 'income' ? 'in' : r.kind === 'transfer' ? 'mut' : 'out')}>${eur(r.amount)}</div></button>`; })}</div>`}
    <button class="btn sec2" onClick=${() => openRec({})}>+ Nuova ricorrenza</button>
  </div>`;
}

// ====================================================================
//  TASSE E CONTRIBUTI
//  Valori suggeriti e relative fonti (da ricontrollare ogni anno):
//  - forfettario: imposta sostitutiva 15% (Agenzia Entrate, scheda regime forfetario),
//    5% per nuove attività con i requisiti; coefficienti: Allegato 2 L. 145/2018.
//  - IRPEF 2026: 23% fino a 28.000, 33% fino a 50.000, 43% oltre (L. 199/2025).
//  - INPS Gestione Separata 2026: 26,07% (24% se già coperti altrove), massimale 122.295 (circ. INPS 8/2026).
//  - ENPAB: soggettivo 15% (fino al 36%), integrativo 4%, maternità 136 € (FAQ ENPAB).
//  - Acconti: metodo storico 100% dell'imposta dell'anno prima; nessun acconto sotto 51,65 €,
//    unica rata a novembre sotto 257,52 €; ripartizione 40/60 (50/50 per i soggetti ISA: da verificare).
// ====================================================================
const COEFF = [[40, 'Alimentari, commercio, alloggio e ristorazione'], [54, 'Commercio ambulante non alimentare'], [62, 'Intermediari del commercio'], [67, 'Altre attività economiche'], [78, 'Professionali, scientifiche, tecniche, sanitarie, istruzione, finanza'], [86, 'Costruzioni e immobiliare']];
const IRPEF = [[28000, 23], [50000, 33], [Infinity, 43]];
const CASSE = {
  enpab: { label: 'ENPAB (biologi)', sogg: 15, soggMin: 1309, integ: 4, integMin: 106, fissi: 136, massimale: 0,
    fonte: 'Aliquote 15% e 4% e maternità 136 €: FAQ ENPAB. Minimi 2026 (1.309 € soggettivo, 106 € integrativo): il totale con la maternità coincide con gli avvisi PagoPA ENPAB 2026, ma possono variare con l’anzianità di iscrizione. Conguaglio dal 31 ottobre dell’anno dopo (calendario ENPAB).' },
  inps_gs: { label: 'INPS Gestione Separata', sogg: 26.07, soggMin: 0, integ: 0, integMin: 0, fissi: 0, massimale: 122295,
    fonte: 'Circolare INPS n. 8/2026: 26,07% per i professionisti senza altra copertura (24% se pensionati o già iscritti altrove), massimale 122.295 €. Nessun contributo minimo.' },
  altra: { label: 'Altra cassa (inserisco io)', sogg: 0, soggMin: 0, integ: 0, integMin: 0, fissi: 0, massimale: 0, fonte: 'Inserisci i valori del regolamento della tua cassa.' },
  nessuna: { label: 'Nessuna cassa', sogg: 0, soggMin: 0, integ: 0, integMin: 0, fissi: 0, massimale: 0, fonte: '' },
};
const TAX_ROLES = { imposta: 'Imposta', contributi: 'Contributi deducibili', integrativo: 'Contributo integrativo', altro: 'Altro (bollo, ecc.)' };
const pct = v => String(round2(v)).replace('.', ',') + '%';
const num = v => { const n = parseAmt(v); return Number.isNaN(n) ? 0 : n; };

function roleOfCat(c, P) {
  if (!c || c.scope !== 'tax') return null;
  const r = P.roles?.[c.id]; if (r) return r;
  const n = c.name.toLowerCase();
  if (/integrativ/.test(n)) return 'integrativo';
  if (/bollo/.test(n)) return 'altro';
  if (/impost|irpef|sostitutiv|tasse|addizional/.test(n)) return 'imposta';
  if (/enpab|inps|contribut|cassa|previden|soggettiv|maternit|minimal/.test(n)) return 'contributi';
  return 'altro';
}
function taxInfo(t, d, P) {
  const c = d.categories[t.category_id]; let role = roleOfCat(c, P); if (!role) return null;
  if (role === 'contributi' && /integrativ/i.test(t.note || '')) role = 'integrativo';
  const part = t.tax_part || (/^saldo/i.test(t.note || '') ? 'saldo' : 'acconto');
  const year = Number(t.tax_year) || (Number(t.date.slice(0, 4)) - (part === 'saldo' ? 1 : 0));
  return { role, part, year };
}
function irpef(imp) { let tax = 0, prev = 0; for (const [lim, rate] of IRPEF) { if (imp <= prev) break; tax += (Math.min(imp, lim) - prev) * rate / 100; prev = lim; } return tax; }

function computeTax(d, P, N) {
  const Y = String(N), today = todayIso(), cur = Number(today.slice(0, 4));
  const txs = live(d.transactions).filter(t => !isAdj(t));
  const onlyInv = P.only_invoiced !== false;
  let incassi = 0, spese = 0, contribPagatiN = 0, accontiN = 0, contribPerN = 0, hasData = false;
  for (const t of txs) {
    const c = d.categories[t.category_id], inYear = t.date.startsWith(Y);
    if (inYear && t.kind === 'income' && c?.scope === 'pro' && (!onlyInv || t.invoiced)) { incassi += +t.amount; spese += +(t.pos_fee || 0); hasData = true; }
    if (inYear && t.kind === 'expense' && c?.scope === 'pro') spese += +t.amount;
    const ti = t.kind === 'expense' ? taxInfo(t, d, P) : null;
    if (!ti) continue;
    if (inYear || ti.year === N) hasData = true;
    if (inYear && ti.role === 'contributi') contribPagatiN += +t.amount;
    if (ti.year === N && ti.role === 'imposta' && ti.part === 'acconto') accontiN += +t.amount;
    if (ti.year === N && (ti.role === 'contributi' || ti.role === 'integrativo')) contribPerN += +t.amount;
  }
  const op = P.opening?.[Y] || {};
  const opInc = num(op.incassi), opSpese = num(op.spese), opContr = num(op.contributi), opAcc = num(op.acconti);
  if (opInc || opSpese || opContr || opAcc) hasData = true;
  incassi += opInc; spese += opSpese; contribPagatiN += opContr; accontiN += opAcc;
  const cassa = CASSE[P.cassa] ? { ...CASSE[P.cassa], ...(P.cassaVals || {}) } : CASSE.nessuna;
  const integPct = num(cassa.integ);
  const compensiReali = P.integ_incluso && integPct ? incassi / (1 + integPct / 100) : incassi;
  let factor = 1;
  if (N === cur && P.proietta) { const start = new Date(cur, 0, 1), days = Math.floor((new Date() - start) / 864e5) + 1, tot = (cur % 4 === 0 ? 366 : 365); factor = tot / Math.max(days, 1); }
  const compensi = compensiReali * factor, spesePro = spese * factor;
  const r = { N, factor, hasData, hasIncome: incassi > 0, opening: op, incassi: incassi * factor, compensi, spesePro, contribPagatiN, accontiN, contribPerN, cassa };
  if (P.regime === 'forfettario') {
    r.redditoLordo = compensi * num(P.coeff ?? 78) / 100;
    r.imponibile = Math.max(0, r.redditoLordo - contribPagatiN);
    r.imposta = r.imponibile * num(P.aliquota ?? 15) / 100;
    r.accontoBase = r.imposta;
  } else if (P.regime === 'ordinario') {
    r.redditoLordo = Math.max(0, compensi - spesePro);
    r.imponibile = Math.max(0, r.redditoLordo - contribPagatiN);
    r.irpefLorda = irpef(r.imponibile);
    r.irpefNetta = Math.max(0, r.irpefLorda - num(P.detrazioni));
    r.addizionali = r.imponibile * num(P.addizionali) / 100;
    r.imposta = r.irpefNetta + r.addizionali;
    r.accontoBase = r.irpefNetta;
  } else return null;
  r.saldo = r.imposta - accontiN;
  const base = r.accontoBase;
  r.accontiNext = base <= 51.65 ? 0 : base;
  const first = num(P.prima_rata ?? 40) / 100;
  r.acc1 = r.accontiNext >= 257.52 ? r.accontiNext * first : 0;
  r.acc2 = r.accontiNext - r.acc1;
  const baseCassa = Math.max(0, r.redditoLordo);
  let bSogg = baseCassa; if (num(cassa.massimale) > 0) bSogg = Math.min(bSogg, num(cassa.massimale));
  r.sogg = num(cassa.sogg) ? Math.max(num(cassa.soggMin), bSogg * num(cassa.sogg) / 100) : 0;
  r.integ = integPct ? Math.max(num(cassa.integMin), compensiReali * factor * integPct / 100) : 0;
  r.fissi = num(cassa.fissi);
  r.contribDovuti = r.sogg + r.integ + r.fissi;
  r.conguaglio = r.contribDovuti - contribPerN;
  r.giugno = Math.max(0, r.saldo) + r.acc1;
  r.novembre = r.acc2;
  r.totale = r.giugno + r.novembre + Math.max(0, r.conguaglio);
  const juneEnd = new Date(N + 1, 5, 30), months = Math.max(1, Math.round((juneEnd - new Date()) / (30.44 * 864e5)));
  r.mesi = months; r.alMese = (r.giugno + Math.max(0, r.conguaglio)) / months; r.juneFuture = juneEnd > new Date();
  return r;
}

// ---------- scadenze fiscali (generate dal profilo e dalla stima) ----------
function taxDeadlines(d) {
  const P = d.settings.tax || {}, piva = P.regime === 'forfettario' || P.regime === 'ordinario';
  if (!piva && P.cassa !== 'enpab') return [];
  const today = todayIso(), cur = Number(today.slice(0, 4)), out = [];
  const infos = live(d.transactions).filter(t => t.kind === 'expense').map(t => ({ t, ti: taxInfo(t, d, P) })).filter(x => x.ti);
  const cache = {}; const ct = y => (y in cache ? cache[y] : (cache[y] = piva ? computeTax(d, P, y) : null));
  const known = r => r && r.hasIncome;
  const first = num(P.prima_rata ?? 40) / 100;
  const isContr = x => x.ti.role === 'contributi' || x.ti.role === 'integrativo';
  for (const Y of [cur, cur + 1]) {
    const base = ct(Y - 1);
    if (piva) {
      const acc = infos.filter(x => x.ti.role === 'imposta' && x.ti.part === 'acconto' && x.ti.year === Y);
      const paid1 = acc.filter(x => x.t.date <= `${Y}-10-31`).reduce((a, x) => a + +x.t.amount, 0) + num(P.opening?.[String(Y)]?.acconti);
      const saldoAmt = known(base) ? Math.max(0, round2(base.saldo)) : null;
      let acc1 = known(base) ? round2(base.acc1) : null, acc2 = known(base) ? round2(base.acc2) : null;
      if (acc2 === null && paid1 > 0 && first > 0 && first < 1) acc2 = round2(paid1 * (1 - first) / first);
      if (saldoAmt !== 0) out.push({ id: `tax:imp-saldo:${Y - 1}`, rate: 'tax', date: `${Y}-06-30`, label: `Saldo imposta ${Y - 1}`, amount: saldoAmt, role: 'imposta', part: 'saldo', year: Y - 1, done: infos.some(x => x.ti.role === 'imposta' && x.ti.part === 'saldo' && x.ti.year === Y - 1) });
      if (acc1 !== 0) out.push({ id: `tax:imp-acc1:${Y}`, rate: 'tax', date: `${Y}-06-30`, label: `1° acconto imposta ${Y}`, amount: acc1, role: 'imposta', part: 'acconto', year: Y, done: paid1 > 0 });
      if (acc2 !== 0) out.push({ id: `tax:imp-acc2:${Y}`, date: `${Y}-11-30`, label: `2° acconto imposta ${Y}`, amount: acc2, role: 'imposta', part: 'acconto', year: Y, done: acc.some(x => x.t.date > `${Y}-10-31`) });
    }
    if (P.cassa === 'enpab') {
      const cv = { ...CASSE.enpab, ...(P.cassaVals || {}) }, min = num(cv.soggMin) + num(cv.integMin) + num(cv.fissi);
      const nAcc = infos.filter(x => isContr(x) && x.ti.part === 'acconto' && x.ti.year === Y).length;
      if (min > 0) {
        out.push({ id: `tax:enpab-min1:${Y}`, date: `${Y}-04-30`, label: `Minimi ENPAB ${Y}, 1ª rata`, amount: round2(min / 2), role: 'contributi', part: 'acconto', year: Y, done: nAcc >= 1 });
        out.push({ id: `tax:enpab-min2:${Y}`, date: `${Y}-06-30`, label: `Minimi ENPAB ${Y}, 2ª rata`, amount: round2(min / 2), role: 'contributi', part: 'acconto', year: Y, done: nAcc >= 2 });
      }
      const cong = known(base) ? Math.max(0, round2(base.conguaglio)) : null;
      if (cong !== 0) out.push({ id: `tax:enpab-cong:${Y - 1}`, rate: 'enpab', date: `${Y}-10-31`, label: `Conguaglio ENPAB ${Y - 1}`, hint: 'anche in 4 rate fino a febbraio', amount: cong, role: 'contributi', part: 'saldo', year: Y - 1, done: infos.some(x => isContr(x) && x.ti.part === 'saldo' && x.ti.year === Y - 1) });
    }
  }
  const plans = P.plans || {}, res = [];
  for (const x of out) {
    const pl = plans[x.id];
    if (pl && Array.isArray(pl.dates)) {
      pl.dates.forEach((dt, k) => { const id = `${x.id}:r${k + 1}`; if (!d.transactions[id]) res.push({ ...x, id, parent: x.id, date: dt, amount: pl.amounts[k], label: `${x.label}, rata ${k + 1} di ${pl.dates.length}`, hint: k > 0 && x.rate === 'tax' ? 'interessi stimati inclusi' : '', rate: null }); });
    } else if (!x.done && !d.transactions[x.id]) res.push(x);
  }
  return res.sort((a, b) => a.date.localeCompare(b.date));
}
// Piani di rateizzazione. Fonti: calendario ENPAB 2026-2027 (conguaglio in unica soluzione o 4 rate:
// 31/10, 30/11, 31/12, 1/2); imposte: art. 8 D.Lgs. 1/2024 e circ. AE 9/2024 (saldo e 1° acconto in rate
// mensili il 16 di ogni mese, ultima entro il 16 dicembre, interessi 4% annuo; il 2° acconto non è rateizzabile).
function ratePlanDates(dl) {
  const Y = Number(dl.date.slice(0, 4));
  if (dl.rate === 'enpab') return [`${Y}-10-31`, `${Y}-11-30`, `${Y}-12-31`, `${Y + 1}-02-01`];

function taxWindows(d) {

      ${cassa !== 'nessuna' && html`
        <div class="two"><${AmountField} label="Soggettivo (%)" value=${cv.sogg} onInput=${v => setV('sogg', v)} /><${AmountField} label="Soggettivo minimo (€)" value=${cv.soggMin} onInput=${v => setV('soggMin', v)} /></div>
        <div class="two"><${AmountField} label="Integrativo (%)" value=${cv.integ} onInput=${v => setV('integ', v)} /><${AmountField} label="Integrativo minimo (€)" value=${cv.integMin} onInput=${v => setV('integMin', v)} /></div>
        <div class="two"><${AmountField} label="Quote fisse annue (€)" value=${cv.fissi} onInput=${v => setV('fissi', v)} /><${AmountField} label="Massimale reddito (€, 0 = nessuno)" value=${cv.massimale} onInput=${v => setV('massimale', v)} /></div>
        ${num(cv.integ) > 0 && html`<label class="check"><input type="checkbox" checked=${integIncl} onChange=${e => setIntegIncl(e.target.checked)} />Le entrate che registro includono già l’integrativo addebitato al cliente</label>`}`}
      <label class="check"><input type="checkbox" checked=${onlyInv} onChange=${e => setOnlyInv(e.target.checked)} />Considera solo le entrate di lavoro con fattura</label>
      <label class="check"><input type="checkbox" checked=${proietta} onChange=${e => setProietta(e.target.checked)} />Per l’anno in corso, proietta gli incassi a fine anno</label>
      <${AmountField} label="Prima rata acconto (%)" value=${primaRata} onInput=${setPrimaRata} />
      <p class="hint">Ripartizione ordinaria 40% a giugno e 60% a novembre. Per i soggetti ISA è 50% e 50%, e sui forfettari le fonti non concordano: chiedi al commercialista quale vale per te.</p>
      ${taxCats.length > 0 && html`<div class="sec">Che cosa sono i tuoi versamenti</div><p class="hint">Serve a distinguere l’imposta dai contributi nelle voci di tipo “Tasse e contributi”.</p>
        ${taxCats.map(c => html`<label class="f"><span>${c.name}</span><select class="i" value=${roles[c.id] || roleOfCat(c, {})} onChange=${e => setRoles({ ...roles, [c.id]: e.target.value })}>${Object.entries(TAX_ROLES).map(([k, l]) => html`<option value=${k}>${l}</option>`)}</select></label>`)}`}`}
    <button class="btn" onClick=${save}>Salva profilo</button>
  <//>`;
}

// ---------- impostazioni ----------
function Settings({ store, user, open }) {
  const s = store.data.settings;
  const [pct, setPct] = useState(fmtIn(s.pos_pct ?? '')), [fix, setFix] = useState(fmtIn(s.pos_fixed ?? '')), [msg, setMsg] = useState('');
  const savePos = () => { const p = pct.trim() === '' ? null : parseAmt(pct), f = fix.trim() === '' ? null : parseAmt(fix); if (Number.isNaN(p) || Number.isNaN(f)) return setMsg('Valori non validi.'); store.setSettings({ pos_pct: p, pos_fixed: f }); setMsg('Salvato.'); setTimeout(() => setMsg(''), 2000); };
  const onImport = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { const j = await readFileJson(f); if (!confirm('Importare questo backup? I dati già presenti non vengono cancellati; se reimporti lo stesso file non si creano doppioni.')) return; alert(importJson(store, j)); store.applyRecurring(); store.snapshot(true).catch(() => {}); } catch (er) { alert(er.message); } };
  const logout = async () => { if (store.pending && !confirm(`Ci sono ${store.pending} modifiche non ancora inviate al server. Restano su questo dispositivo e verranno inviate al prossimo accesso. Uscire comunque?`)) return; await sb.auth.signOut(); };
  const nAcc = live(store.data.accounts).length, nCat = live(store.data.categories).length;
  return html`<div>
    <div class="sec">Personalizza</div>
    <div><button class="setrow" onClick=${() => open('accounts')}><span>Conti</span><small>${nAcc} ›</small></button><button class="setrow" onClick=${() => open('categories')}><span>Voci di entrata e uscita</span><small>${nCat} ›</small></button><button class="setrow" onClick=${() => open('taxprofile')}><span>Profilo fiscale</span><small>›</small></button></div>
    <div class="sec">Pagamenti con POS</div>
    <div class="card"><p class="hint" style="margin-top:0">Le condizioni del tuo contratto POS. Vengono proposte in automatico quando segni un incasso con POS.</p>
      <div class="two"><${AmountField} label="Commissione %" value=${pct} onInput=${setPct} /><${AmountField} label="Costo fisso (€)" value=${fix} onInput=${setFix} /></div>
      <button class="btn sec2" onClick=${savePos}>Salva condizioni POS</button>${msg && html`<div class="okmsg">${msg}</div>`}</div>
    <div class="sec">Sicurezza dei dati</div>
    <div><button class="setrow" onClick=${() => shareOrDownload(store.exportObj(), 'finanze-backup-' + todayIso() + '.json')}><span>Esporta backup</span><small>›</small></button>
      <label class="setrow" style="cursor:pointer"><span>Importa backup</span><small>anche dalla vecchia app ›</small><input type="file" accept="application/json,.json" style="display:none" onChange=${onImport} /></label>
      <button class="setrow" onClick=${() => open('snapshots')}><span>Copie automatiche</span><small>›</small></button>
      <button class="setrow" onClick=${() => open('trash')}><span>Cestino</span><small>›</small></button></div>
    <div class="sec">Account</div>
    <div class="card"><div>${user.email}</div><p class="hint">I dati sono salvati sul server e protetti dal tuo account: li ritrovi su qualsiasi dispositivo.</p><button class="btn danger" onClick=${logout}>Esci</button></div>
  </div>`;
}

// ---------- benvenuto (primo accesso) ----------
function Welcome({ store }) {
  const [err, setErr] = useState('');
  const onImport = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { const msg = importJson(store, await readFileJson(f)); store.applyRecurring(); setTimeout(() => store.snapshot(true).catch(() => {}), 3000); alert(msg); } catch (er) { setErr(er.message); } };
  return html`<div class="center"><p class="brand">Benvenuto</p>
    <p>Per iniziare puoi recuperare i dati dalla versione precedente dell’app, oppure partire con conti e voci di base da personalizzare.</p>
    <label class="btn" style="text-align:center">Importa un backup<input type="file" accept="application/json,.json" style="display:none" onChange=${onImport} /></label>
    <button class="btn sec2" onClick=${() => seedDefaults(store)}>Parti da zero</button>
    ${err && html`<div class="err" role="alert">${err}</div>`}</div>`;
}

// ---------- app principale ----------
function Main({ user }) {
  const store = useMemo(() => createStore(user.id), [user.id]);
  const [, force] = useState(0);
  useEffect(() => { const un = store.subscribe(() => force(x => x + 1)); store.start(); return () => { un(); store.stop(); }; }, [store]);
  const [tab, setTab] = useState('mov'), [sheet, setSheet] = useState(null), [movInit, setMovInit] = useState(null);
  const goMov = f => { setMovInit({ ...f, n: Date.now() }); setTab('mov'); window.scrollTo(0, 0); };
  const d = store.data, st = store.st, hasAcc = live(d.accounts).length > 0;
  if (!hasAcc && !st.loaded) return html`<div class="center"><p class="brand">Finanze</p><p class="mut">${st.error || 'Caricamento dei tuoi dati…'}</p>${st.error && html`<button class="btn" onClick=${() => store.pull()}>Riprova</button>`}</div>`;
  if (!hasAcc) return html`<${Welcome} store=${store} />`;
  const close = () => setSheet(null);
  const TABS = [['mov', '☰', 'Movimenti'], ['charts', '▤', 'Grafici'], ['tax', '%', 'Tasse'], ['rec', '↻', 'Ricorrenti'], ['set', '⚙', 'Impostazioni']];
  return html`<div class="wrap">
    <div class="top"><h1>${TABS.find(t => t[0] === tab)[2]}</h1><${SyncPill} store=${store} /></div>
    ${tab === 'mov' && html`<${Movements} key=${movInit?.n || 0} init=${movInit} store=${store} openTx=${t => setSheet({ k: 'tx', v: t })} goTab=${setTab} />`}
    ${tab === 'charts' && html`<${Charts} store=${store} goMov=${goMov} />`}
    ${tab === 'rec' && html`<${Recurring} store=${store} openRec=${r => setSheet({ k: 'rec', v: r })} openPlan=${dl => setSheet({ k: 'plan', v: dl })} />`}
    ${tab === 'tax' && html`<${TaxView} store=${store} openProfile=${() => setSheet({ k: 'taxprofile' })} openTx=${t => setSheet({ k: 'tx', v: t })} openOpening=${y => setSheet({ k: 'opening', v: y })} />`}
    ${tab === 'set' && html`<${Settings} store=${store} user=${user} open=${k => setSheet({ k })} />`}
    ${(tab === 'mov' || tab === 'charts' || tab === 'tax') && html`<button class="fab" onClick=${() => setSheet({ k: 'tx', v: {} })}>+ Movimento</button>`}
    <nav class="tabs"><div class="in2">${TABS.map(([k, ic, l]) => html`<button class=${tab === k ? 'on' : ''} aria-current=${tab === k ? 'page' : null} onClick=${() => { if (k === 'mov') setMovInit(null); setTab(k); }}><span aria-hidden="true">${ic}</span>${l}</button>`)}</div></nav>
    ${sheet?.k === 'tx' && html`<${TxForm} key=${sheet.v.id || 'new'} store=${store} tx=${sheet.v} onClose=${close} />`}
    ${sheet?.k === 'rec' && html`<${RecForm} key=${sheet.v.id || 'new'} store=${store} rec=${sheet.v} onClose=${close} />`}
    ${sheet?.k === 'accounts' && html`<${AccountsEditor} store=${store} onClose=${close} />`}
    ${sheet?.k === 'categories' && html`<${CategoriesEditor} store=${store} onClose=${close} />`}
    ${sheet?.k === 'plan' && html`<${RatePlan} store=${store} dl=${sheet.v} onClose=${close} />`}
    ${sheet?.k === 'opening' && html`<${TaxOpening} store=${store} year=${sheet.v} onClose=${close} />`}
    ${sheet?.k === 'taxprofile' && html`<${TaxProfile} store=${store} onClose=${close} />`}
    ${sheet?.k === 'trash' && html`<${Trash} store=${store} onClose=${close} />`}
    ${sheet?.k === 'snapshots' && html`<${Snapshots} store=${store} onClose=${close} />`}
  </div>`;
}

// ---------- accesso ----------
const ERR_IT = [[/invalid login/i, 'Email o password non corretti.'], [/not confirmed/i, 'Conferma prima l’indirizzo email: controlla la posta (anche lo spam).'], [/already registered/i, 'Esiste già un account con questa email: accedi.'], [/at least 6|password should/i, 'La password deve avere almeno 6 caratteri.'], [/rate limit/i, 'Troppi tentativi: riprova tra qualche minuto.'], [/fetch|network/i, 'Connessione assente: riprova quando sei online.']];
const itErr = e => { const m = e?.message || String(e); for (const [r, t] of ERR_IT) if (r.test(m)) return t; return m; };
function Login() {
  const [mode, setMode] = useState('in'), [email, setEmail] = useState(''), [pw, setPw] = useState(''), [err, setErr] = useState(''), [msg, setMsg] = useState(''), [busy, setBusy] = useState(false);
  const redirect = location.origin + location.pathname;
  const submit = async e => {
    e.preventDefault(); setErr(''); setMsg(''); setBusy(true);
    try {
      if (mode === 'in') { const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw }); if (error) throw error; }
      else if (mode === 'up') { const { data, error } = await sb.auth.signUp({ email: email.trim(), password: pw, options: { emailRedirectTo: redirect } }); if (error) throw error; if (!data.session) setMsg('Ti abbiamo mandato un’email: apri il link per confermare l’account, poi torna qui e accedi.'); }
      else { const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: redirect }); if (error) throw error; setMsg('Se l’email è registrata, riceverai un link per scegliere una nuova password.'); }
    } catch (er) { setErr(itErr(er)); }
    setBusy(false);
  };
  return html`<form class="center" onSubmit=${submit}><p class="brand">Finanze</p>
    <p class="mut" style="margin-top:0">${mode === 'in' ? 'Accedi per vedere i tuoi conti.' : mode === 'up' ? 'Crea il tuo account: i dati restano privati e salvati sul server.' : 'Ti mandiamo un link per scegliere una nuova password.'}</p>
    <label class="f"><span>Email</span><input class="i" type="email" autocomplete="email" required value=${email} onInput=${e => setEmail(e.target.value)} /></label>
    ${mode !== 'reset' && html`<label class="f"><span>Password</span><input class="i" type="password" autocomplete=${mode === 'up' ? 'new-password' : 'current-password'} required minlength="6" value=${pw} onInput=${e => setPw(e.target.value)} /></label>`}
    ${err && html`<div class="err" role="alert">${err}</div>`}${msg && html`<div class="okmsg">${msg}</div>`}
    <button class="btn" disabled=${busy}>${mode === 'in' ? 'Accedi' : mode === 'up' ? 'Crea account' : 'Invia link'}</button>
    <div style="display:flex;justify-content:space-between;margin-top:10px">
      ${mode === 'in' ? html`<button type="button" class="linkbtn" onClick=${() => setMode('up')}>Crea un account</button><button type="button" class="linkbtn" onClick=${() => setMode('reset')}>Password dimenticata</button>`
        : html`<button type="button" class="linkbtn" onClick=${() => setMode('in')}>‹ Torna all’accesso</button>`}</div></form>`;
}
function NewPassword({ onDone }) {
  const [pw, setPw] = useState(''), [err, setErr] = useState(''), [busy, setBusy] = useState(false);
  const submit = async e => { e.preventDefault(); setBusy(true); const { error } = await sb.auth.updateUser({ password: pw }); setBusy(false); if (error) setErr(itErr(error)); else { alert('Password aggiornata.'); onDone(); } };
  return html`<form class="center" onSubmit=${submit}><p class="brand">Nuova password</p>
    <label class="f"><span>Scegli una nuova password</span><input class="i" type="password" autocomplete="new-password" required minlength="6" value=${pw} onInput=${e => setPw(e.target.value)} /></label>
    ${err && html`<div class="err" role="alert">${err}</div>`}<button class="btn" disabled=${busy}>Salva password</button></form>`;
}

function App() {
  const [session, setSession] = useState(undefined), [recovery, setRecovery] = useState(false);
  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: { subscription } } = sb.auth.onAuthStateChange((ev, s) => { if (ev === 'PASSWORD_RECOVERY') setRecovery(true); setSession(s); });
    return () => subscription.unsubscribe();
  }, []);
  if (!CONFIGURED) return html`<div class="center"><p class="brand">Finanze</p><p>L’app non è ancora collegata al database. Inserisci Project URL e chiave anon di Supabase in cima allo script di <b>index.html</b>.</p></div>`;
  if (session === undefined) return html`<div class="center"><p class="brand">Finanze</p><p class="mut">Caricamento…</p></div>`;
  if (recovery && session) return html`<${NewPassword} onDone=${() => setRecovery(false)} />`;
  if (!session) return html`<${Login} />`;
  return html`<${Main} key=${session.user.id} user=${session.user} />`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
