/* ============================================================
   ACCESSO
   ============================================================ */
function Accesso({onEntrato}){
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [errore,setErrore]=useState("");
  const [attesa,setAttesa]=useState(false);

  async function entra(){
    setAttesa(true); setErrore("");
    const {data,error} = await db.auth.signInWithPassword({email,password});
    setAttesa(false);
    if(error){ setErrore("Email o password non corrispondono."); return; }
    onEntrato(data.user);
  }

  return (
    <main style={{maxWidth:380,paddingTop:70}}>
      <h2>NutriOra Studio</h2>
      <p className="sottotitolo">Entra con le credenziali che usi su NutriOra.</p>
      <div className="scheda griglia">
        {errore && <div className="errore">{errore}</div>}
        <div>
          <label htmlFor="e">Email</label>
          <input id="e" type="email" value={email} autoComplete="username"
            onChange={e=>setEmail(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&entra()}/>
        </div>
        <div>
          <label htmlFor="p">Password</label>
          <input id="p" type="password" value={password} autoComplete="current-password"
            onChange={e=>setPassword(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&entra()}/>
        </div>
        <button className="btn" onClick={entra} disabled={attesa||!email||!password}>
          {attesa?"Un attimo…":"Entra"}
        </button>
      </div>
    </main>
  );
}

/* ============================================================
   SEDI
   ============================================================ */
function Sedi({utente}){
  const [sedi,setSedi]=useState([]);
  const [errore,setErrore]=useState("");
  const [inModifica,setInModifica]=useState(null);

  const carica = useCallback(async()=>{
    const {data,error} = await db.from("sedi").select("*").order("nome");
    if(error){ setErrore(error.message); return; }
    setSedi(data||[]);
  },[]);
  useEffect(()=>{carica()},[carica]);

  function nuova(){
    setInModifica({nome:"",tipo_costo:"giornata",commissione_pos:0,
      affitto_mensile:"",indirizzo:"",attiva:true});
  }

  async function salva(){
    const s = inModifica;
    const riga = {
      nome:s.nome.trim(),
      tipo_costo:s.tipo_costo,
      commissione_pos:Number(s.commissione_pos)||0,
      affitto_mensile:s.affitto_mensile===""?null:Number(s.affitto_mensile),
      indirizzo:s.indirizzo||null,
      attiva:s.attiva,
    };
    let error;
    if(s.id){
      ({error} = await db.from("sedi").update(riga).eq("id",s.id));
    }else{
      riga.nutrizionista_id = utente.id;
      ({error} = await db.from("sedi").insert(riga));
    }
    if(error){ setErrore(error.message); return; }
    setInModifica(null); setErrore(""); carica();
  }

  async function elimina(id){
    if(!confirm("Vuoi eliminare questa sede? Le giornate gia' registrate la useranno ancora, quindi se ne hai fatte l'eliminazione verra' rifiutata.")) return;
    const {error} = await db.from("sedi").delete().eq("id",id);
    if(error){ setErrore("Non si puo' eliminare: ci sono giornate collegate. Puoi metterla su Non attiva."); return; }
    carica();
  }

  if(inModifica) return (
    <>
      <h2>{inModifica.id?"Modifica sede":"Nuova sede"}</h2>
      <p className="sottotitolo">
        La commissione POS serve a calcolare il netto: mettila come la trovi
        sull'estratto del terminale, ad esempio 1,5 per l'1,5%.
      </p>
      {errore && <div className="errore">{errore}</div>}
      <div className="scheda griglia" style={{maxWidth:520}}>
        <div>
          <label>Nome</label>
          <input value={inModifica.nome}
            onChange={e=>setInModifica({...inModifica,nome:e.target.value})}/>
        </div>
        <div>
          <label>Indirizzo</label>
          <input value={inModifica.indirizzo||""}
            onChange={e=>setInModifica({...inModifica,indirizzo:e.target.value})}/>
        </div>
        <div>
          <label>Come paghi questa sede</label>
          <select value={inModifica.tipo_costo}
            onChange={e=>setInModifica({...inModifica,tipo_costo:e.target.value})}>
            <option value="giornata">Quota che scrivo giorno per giorno</option>
            <option value="mensile">Canone fisso mensile</option>
          </select>
        </div>
        {inModifica.tipo_costo==="mensile" && (
          <div>
            <label>Canone mensile in euro</label>
            <input type="number" step="0.01" value={inModifica.affitto_mensile||""}
              onChange={e=>setInModifica({...inModifica,affitto_mensile:e.target.value})}/>
          </div>
        )}
        <div>
          <label>Commissione POS in percentuale</label>
          <input type="number" step="0.001" value={inModifica.commissione_pos}
            onChange={e=>setInModifica({...inModifica,commissione_pos:e.target.value})}/>
        </div>
        <div>
          <label>
            <input type="checkbox" style={{width:"auto",marginRight:8}}
              checked={inModifica.attiva}
              onChange={e=>setInModifica({...inModifica,attiva:e.target.checked})}/>
            Ci ricevo ancora
          </label>
        </div>
        <div style={{display:"flex",gap:10}}>
          <button className="btn" onClick={salva} disabled={!inModifica.nome.trim()}>
            Salva sede
          </button>
          <button className="btn secondario" onClick={()=>{setInModifica(null);setErrore("")}}>
            Annulla
          </button>
        </div>
      </div>
    </>
  );

  return (
    <>
      <h2>Sedi</h2>
      <p className="sottotitolo">Gli studi e le palestre dove ricevi.</p>
      {errore && <div className="errore">{errore}</div>}
      <div className="scheda" style={{padding:0,overflow:"hidden"}}>
        {sedi.length===0 ? (
          <div className="vuoto">Non hai ancora nessuna sede. Aggiungi la prima.</div>
        ) : (
          <table>
            <thead><tr>
              <th>Sede</th>
              <th className="nascondi">Costo</th>
              <th className="destra">POS</th>
              <th></th>
            </tr></thead>
            <tbody>
              {sedi.map(s=>(
                <tr key={s.id}>
                  <td>
                    <div style={{fontWeight:500}}>{s.nome}</div>
                    {!s.attiva && <span className="pillola">Non attiva</span>}
                  </td>
                  <td className="nascondi">
                    {s.tipo_costo==="mensile"
                      ? `${eur(s.affitto_mensile)} al mese`
                      : "Quota giornaliera"}
                  </td>
                  <td className="destra num">{Number(s.commissione_pos)}%</td>
                  <td className="destra" style={{whiteSpace:"nowrap"}}>
                    <button className="btn secondario" style={{padding:"5px 10px"}}
                      onClick={()=>setInModifica(s)}>Modifica</button>
                    <button className="btn pericolo" style={{padding:"5px 10px",marginLeft:6}}
                      onClick={()=>elimina(s.id)}>Elimina</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
      <button className="btn" style={{marginTop:16}} onClick={nuova}>Aggiungi sede</button>
    </>
  );
}

/* ============================================================
   CERCA PAZIENTE
   ============================================================ */
function CercaPaziente({utente,onScelto}){
  const [testo,setTesto]=useState("");
  const [risultati,setRisultati]=useState([]);
  const [cercando,setCercando]=useState(false);

  useEffect(()=>{
    if(testo.trim().length<2){ setRisultati([]); return; }
    let annullato=false;
    const t=setTimeout(async()=>{
      setCercando(true);
      const {data} = await db.from("pazienti")
        .select("id,nome,email").ilike("nome",`%${testo.trim()}%`).limit(8);
      if(!annullato){ setRisultati(data||[]); setCercando(false); }
    },250);
    return ()=>{annullato=true;clearTimeout(t)};
  },[testo]);

  async function creaNuovo(){
    const nome = testo.trim();
    if(!nome) return;
    const {data,error} = await db.from("pazienti")
      .insert({nome,origine:"gestionale",nutrizionista_id:utente.id})
      .select("id,nome").single();
    if(error){ alert("Non sono riuscito a creare il paziente: "+error.message); return; }
    onScelto(data); setTesto(""); setRisultati([]);
  }

  return (
    <div>
      <label>Paziente</label>
      <input value={testo} placeholder="Scrivi il cognome o il nome"
        onChange={e=>setTesto(e.target.value)}/>
      {testo.trim().length>=2 && (
        <div className="risultati">
          {risultati.map(p=>(
            <button key={p.id} onClick={()=>{onScelto(p);setTesto("");setRisultati([])}}>
              {p.nome}
              {p.email && <span style={{color:"var(--testo-tenue)",fontSize:13}}> · {p.email}</span>}
            </button>
          ))}
          {!cercando && risultati.length===0 && (
            <button onClick={creaNuovo}>
              Nessuno trovato. Aggiungi <b>{testo.trim()}</b> come nuovo paziente
            </button>
          )}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   GIORNATA
   ============================================================ */
function Giornata({utente}){
  const [sedi,setSedi]=useState([]);
  const [data,setData]=useState(oggi());
  const [sedeId,setSedeId]=useState("");
  const [giornata,setGiornata]=useState(null);
  const [visite,setVisite]=useState([]);
  const [pagamenti,setPagamenti]=useState([]);
  const [errore,setErrore]=useState("");
  const [quota,setQuota]=useState("");

  const [paziente,setPaziente]=useState(null);
  const [prestazione,setPrestazione]=useState("controllo");
  const [importo,setImporto]=useState("");
  const [metodo,setMetodo]=useState("pos");
  const [fattura,setFattura]=useState(false);

  const sede = sedi.find(s=>s.id===sedeId);

  useEffect(()=>{(async()=>{
    const {data:d,error} = await db.from("sedi").select("*")
      .eq("attiva",true).order("nome");
    if(error){ setErrore(error.message); return; }
    setSedi(d||[]);
    if(d&&d.length&&!sedeId) setSedeId(d[0].id);
  })()},[]);

  const caricaGiornata = useCallback(async()=>{
    if(!sedeId||!data){ setGiornata(null); return; }
    const {data:g} = await db.from("giornate").select("*")
      .eq("data",data).eq("sede_id",sedeId).maybeSingle();
    setGiornata(g||null);
    setQuota(g? String(g.quota_studio) : "");
    if(!g){ setVisite([]); setPagamenti([]); return; }
    const [{data:v},{data:p}] = await Promise.all([
      db.from("visite").select("*, pazienti(nome)")
        .eq("giornata_id",g.id).order("creata_il"),
      db.from("pagamenti").select("*, pazienti(nome)")
        .eq("giornata_id",g.id).order("creato_il"),
    ]);
    setVisite(v||[]); setPagamenti(p||[]);
  },[data,sedeId]);
  useEffect(()=>{caricaGiornata()},[caricaGiornata]);

  async function apriGiornata(){
    const {data:g,error} = await db.from("giornate")
      .insert({data,sede_id:sedeId,quota_studio:0,nutrizionista_id:utente.id})
      .select("*").single();
    if(error){ setErrore(error.message); return null; }
    setGiornata(g); setQuota("0"); return g;
  }

  async function salvaQuota(){
    if(!giornata) return;
    const v = Number(quota)||0;
    const {error} = await db.from("giornate")
      .update({quota_studio:v}).eq("id",giornata.id);
    if(error){ setErrore(error.message); return; }
    setGiornata({...giornata,quota_studio:v});
  }

  async function aggiungi(){
    setErrore("");
    let g = giornata || await apriGiornata();
    if(!g) return;

    const {data:v,error:e1} = await db.from("visite").insert({
      paziente_id:paziente.id, giornata_id:g.id, data,
      prestazione, importo_dovuto: importo===""?null:Number(importo),
      nutrizionista_id:utente.id,
    }).select("*").single();
    if(e1){ setErrore(e1.message); return; }

    if(importo!=="" && Number(importo)>0){
      const perc = metodo==="pos" ? Number(sede?.commissione_pos||0) : 0;
      const {error:e2} = await db.from("pagamenti").insert({
        paziente_id:paziente.id, giornata_id:g.id, visita_id:v.id, data,
        importo:Number(importo), metodo, commissione_perc:perc,
        fattura_emessa:fattura, nutrizionista_id:utente.id,
      });
      if(e2){ setErrore(e2.message); return; }
    }

    setPaziente(null); setImporto(""); setFattura(false);
    setPrestazione("controllo");
    caricaGiornata();
  }

  async function togliVisita(v){
    if(!confirm("Tolgo questa riga e il pagamento collegato?")) return;
    await db.from("pagamenti").delete().eq("visita_id",v.id);
    await db.from("visite").delete().eq("id",v.id);
    caricaGiornata();

/* ============================================================
   PAZIENTI — elenco e scheda anagrafica
   Una sola anagrafica per Nutriora e Studio. I pazienti nati in
   Nutriora si vedono anche qui, ma i dati che Nutriora usa per i
   calcoli (sesso, data di nascita, email) si modificano solo la'.
   ============================================================ */
const CAMPI_DATI = [
  ["luogo_nascita","Luogo di nascita"],
  ["codice_fiscale","Codice fiscale"],
  ["cellulare","Cellulare"],
  ["telefono_fisso","Telefono fisso"],
  ["indirizzo","Indirizzo"],
  ["cap","CAP"],
  ["citta","Città"],
  ["provincia","Provincia"],
];

/* ------------------------------------------------------------
   COMUNI ITALIANI — nome, sigla provincia, codice catastale, CAP
   Il file comuni.json sta nel repo accanto a index.html e viene
   caricato una sola volta, la prima volta che serve.
   CAP vuoto = il comune ne ha piu' di uno (es. Roma): va scritto a mano.
   ------------------------------------------------------------ */
let COMUNI = null, comuniInArrivo = null;
function caricaComuni(){
  if(COMUNI) return Promise.resolve(COMUNI);
  if(!comuniInArrivo) comuniInArrivo = fetch("/comuni.json")
    .then(r=>{ if(!r.ok) throw new Error("comuni.json non trovato"); return r.json(); })
    .then(d=>(COMUNI=d.map(c=>({nome:c[0],sigla:c[1],catastale:c[2],cap:c[3],chiave:normalizza(c[0])}))))
    .catch(e=>{ comuniInArrivo=null; throw e; });
  return comuniInArrivo;
}
const normalizza = t => (t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .toLowerCase().replace(/[^a-z]/g,"");
const etichettaComune = c => `${c.nome} (${c.sigla})`;
// "Roma (RM)" -> il comune; accetta anche il solo nome se non e' ambiguo
function trovaComune(testo){
  if(!COMUNI||!testo) return null;
  const m = testo.match(/^(.*?)\s*\(([A-Za-z]{2})\)\s*$/);
  const chiave = normalizza(m?m[1]:testo);
  const trovati = COMUNI.filter(c=>c.chiave===chiave && (!m||c.sigla===m[2].toUpperCase()));
  return trovati.length===1 ? trovati[0] : null;
}

function CercaComune({valore,onCambia,onScelto,placeholder}){
  const [aperto,setAperto]=useState(false);
  const [elenco,setElenco]=useState([]);
  const [errore,setErrore]=useState("");

  useEffect(()=>{
    const q = normalizza(valore);
    if(!aperto||q.length<2){ setElenco([]); return; }
    caricaComuni().then(tutti=>{
      const inizio = tutti.filter(c=>c.chiave.startsWith(q));
      const dentro = inizio.length<8 ? tutti.filter(c=>!c.chiave.startsWith(q)&&c.chiave.includes(q)) : [];
      setElenco([...inizio,...dentro].slice(0,8)); setErrore("");
    }).catch(()=>setErrore("Elenco dei comuni non disponibile: scrivi a mano."));
  },[valore,aperto]);

  return (
    <div style={{position:"relative"}}>
      <input value={valore||""} placeholder={placeholder} autoComplete="off"
        onChange={e=>{onCambia(e.target.value);setAperto(true)}}
        onFocus={()=>setAperto(true)}
        onBlur={()=>setTimeout(()=>setAperto(false),150)}/>
      {aperto && elenco.length>0 && (
        <div className="risultati" style={{position:"absolute",left:0,right:0,zIndex:5}}>
          {elenco.map(c=>(
            <button key={c.catastale} onMouseDown={e=>e.preventDefault()}
              onClick={()=>{onScelto(c);setAperto(false)}}>
              {c.nome} <span style={{color:"var(--testo-tenue)",fontSize:13}}>({c.sigla})</span>
            </button>
          ))}
        </div>
      )}
      {errore && <div style={{fontSize:12,color:"var(--rosso)",marginTop:4}}>{errore}</div>}
    </div>
  );
}

/* ------------------------------------------------------------
   CODICE FISCALE — regole del DM 23/12/1976.
   Non gestisce l'omocodia (codici modificati dall'Agenzia delle
   Entrate per evitare doppioni): il codice valido resta quello
   della tessera sanitaria.
   ------------------------------------------------------------ */
const soloLettere = t => (t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .toUpperCase().replace(/[^A-Z]/g,"");
const consonanti = t => t.replace(/[AEIOU]/g,"");
const vocali = t => t.replace(/[^AEIOU]/g,"");
function parteCognome(c){ c=soloLettere(c); return (consonanti(c)+vocali(c)+"XXX").slice(0,3); }
function parteNome(n){
  n=soloLettere(n); const k=consonanti(n);
  if(k.length>=4) return k[0]+k[2]+k[3];
  return (k+vocali(n)+"XXX").slice(0,3);
}
const MESI_CF = "ABCDEHLMPRST";
const DISPARI = {0:1,1:0,2:5,3:7,4:9,5:13,6:15,7:17,8:19,9:21,A:1,B:0,C:5,D:7,E:9,F:13,G:15,H:17,I:19,J:21,
  K:2,L:4,M:18,N:20,O:11,P:3,Q:6,R:8,S:12,T:14,U:16,V:10,W:22,X:25,Y:24,Z:23};
const valPari = ch => /[0-9]/.test(ch) ? Number(ch) : ch.charCodeAt(0)-65;
function carattereControllo(cf15){
  let s=0;
  for(let i=0;i<15;i++) s += (i%2===0) ? DISPARI[cf15[i]] : valPari(cf15[i]);
  return String.fromCharCode(65+s%26);
}
function calcolaCF({nome,cognome,sesso,dataNascita,catastale}){
  const [a,m,g] = dataNascita.split("-").map(Number);
  const giorno = g + (sesso==="F"?40:0);
  const base = parteCognome(cognome)+parteNome(nome)+String(a).slice(-2)+
    MESI_CF[m-1]+String(giorno).padStart(2,"0")+catastale.toUpperCase();
  return base+carattereControllo(base);
}

// Nutriora salva "Nome Cognome" in un campo solo. Se il cognome e' gia'
// noto (dati_paziente) lo si stacca da li', altrimenti si propone
// prima parola = nome, resto = cognome, e lo correggi tu se serve.
function dividiNome(completo,cognomeNoto){
  completo=(completo||"").trim().replace(/\s+/g," ");
  const cg=(cognomeNoto||"").trim();
  if(cg && completo.toLowerCase().endsWith(" "+cg.toLowerCase()))
    return [completo.slice(0,completo.length-cg.length).trim(), completo.slice(completo.length-cg.length)];
  const i=completo.indexOf(" ");
  return i<0 ? [completo,""] : [completo.slice(0,i), completo.slice(i+1)];
}

const etaDa = dn => {
  if(!dn) return null;
  const n=new Date(dn), o=new Date();
  let e=o.getFullYear()-n.getFullYear();
  if(o.getMonth()<n.getMonth()||(o.getMonth()===n.getMonth()&&o.getDate()<n.getDate())) e--;
  return e>=0&&e<130?e:null;
};
const dataIt = d => d ? new Date(d+"T00:00:00").toLocaleDateString("it-IT") : "—";
const nomeMetodo = m => m==="pos"?"POS":m==="contanti"?"Contanti":"Bonifico";

function Pazienti({utente}){

function SchedaPaziente({id:idIniziale,nomeIniziale,utente,onChiudi}){
  const [id,setId]=useState(idIniziale);
  const [p,setP]=useState(null);
  const [d,setD]=useState({});
  const [visite,setVisite]=useState([]);
  const [pagamenti,setPagamenti]=useState([]);
  const [errore,setErrore]=useState("");
  const [salvando,setSalvando]=useState(false);
  const [salvato,setSalvato]=useState(false);
  const [avvisoCF,setAvvisoCF]=useState(false);

  useEffect(()=>{(async()=>{
    // Paziente nuovo: la scheda parte vuota e nel database non si scrive
    // nulla finche' non premi Salva, cosi' non restano pazienti fantasma.
    if(!idIniziale){
      const [np,cg] = dividiNome(nomeIniziale);
      setP({id:null,nome:"",nome_proprio:np,cognome:cg,email:"",sesso:"",data_nascita:"",origine:"gestionale"});
      return;
    }
    const [r1,r2,r3,r4] = await Promise.all([
      db.from("pazienti").select("id,nome,email,sesso,data_nascita,origine").eq("id",id).single(),
      db.from("dati_paziente").select("*").eq("paziente_id",id).maybeSingle(),
      db.from("visite").select("id,data,prestazione,giornate(sedi(nome))")
        .eq("paziente_id",id).order("data",{ascending:false}),
      db.from("pagamenti").select("id,visita_id,importo,metodo,fattura_emessa")
        .eq("paziente_id",id),
    ]);
    if(r1.error){ setErrore(r1.error.message); return; }
    const [np,cg] = dividiNome(r1.data.nome, r2.data?.cognome);
    setP({...r1.data,nome_proprio:np,cognome:cg}); setD(r2.data||{});
    setVisite(r3.data||[]); setPagamenti(r4.data||[]);
  })()},[idIniziale]);

  if(!p) return (
    <>
      <button className="btn secondario" onClick={onChiudi}>← Pazienti</button>
      {errore ? <div className="errore" style={{marginTop:16}}>{errore}</div>
              : <p className="sottotitolo" style={{marginTop:16}}>Un attimo…</p>}
    </>
  );

  const daStudio = p.origine!=="nutriora";
  const cambiaP = (k,v)=>{ setP({...p,[k]:v}); setSalvato(false); };
  const cambiaD = (k,v)=>{ setD({...d,[k]:v}); setSalvato(false); };

  async function salva(){
    setErrore(""); setSalvato(false);
    const np = (p.nome_proprio||"").trim(), cg = (p.cognome||"").trim();
    if(!np||!cg){ setErrore("Servono sia il nome sia il cognome."); return; }
    const nome = np+" "+cg;
    setSalvando(true);

    const agg = {nome};
    if(daStudio){
      agg.sesso = p.sesso||null;
      agg.data_nascita = p.data_nascita||null;
      agg.email = (p.email||"").trim().toLowerCase()||null;
      if(agg.email){
        let q = db.from("pazienti").select("nome,origine").eq("email",agg.email);
        if(id) q = q.neq("id",id);
        const {data:altri} = await q.limit(1);
        if(altri&&altri.length){
          setErrore(`Questa email appartiene già a ${altri[0].nome}`+
            (altri[0].origine==="nutriora"?" in Nutriora":"")+
            ". Probabilmente è la stessa persona registrata due volte: non salvo, per non creare un doppione.");
          setSalvando(false); return;
        }
      }
    }
    let pid = id;
    if(!pid){
      const {data:creato,error:e0} = await db.from("pazienti")
        .insert({...agg,origine:"gestionale",nutrizionista_id:utente.id})
        .select("id").single();
      if(e0){ setErrore("Paziente non creato: "+e0.message); setSalvando(false); return; }
      pid = creato.id; setId(pid);
    } else {
      const {error:e1} = await db.from("pazienti").update(agg).eq("id",pid);
      if(e1){ setErrore("Anagrafica non salvata: "+e1.message); setSalvando(false); return; }
    }

    const riga = {paziente_id:pid, nutrizionista_id:utente.id,
                  aggiornato_il:new Date().toISOString(), cognome:cg};
    CAMPI_DATI.forEach(([k])=>{
      let v = (d[k]??"").toString().trim();
      if(k==="codice_fiscale"||k==="provincia") v = v.toUpperCase();
      riga[k] = v||null;
    });
    const {error:e2} = await db.from("dati_paziente").upsert(riga,{onConflict:"paziente_id"});
    if(e2){ setErrore("Contatti e residenza non salvati: "+e2.message); setSalvando(false); return; }

    setP({...p,...agg,id:pid}); setD({...d,...riga});
    setSalvando(false); setSalvato(true);
  }

  async function calcolaCodice(){
    setErrore(""); setAvvisoCF(false);
    const mancano=[];
    if(!(p.nome_proprio||"").trim()) mancano.push("nome");
    if(!(p.cognome||"").trim()) mancano.push("cognome");
    if(!p.sesso) mancano.push("sesso");
    if(!p.data_nascita) mancano.push("data di nascita");
    if(!(d.luogo_nascita||"").trim()) mancano.push("luogo di nascita");
    if(mancano.length){ setErrore("Per calcolare il codice fiscale mancano: "+mancano.join(", ")+"."); return; }

    catch(e){ setErrore("Elenco dei comuni non disponibile, il codice non si può calcolare adesso."); return; }
    const c = trovaComune(d.luogo_nascita);
    if(!c){
      setErrore("Non riconosco il luogo di nascita: sceglilo dall'elenco che compare mentre scrivi. "+
        "Per chi è nato all'estero il calcolo non è disponibile: copia il codice dalla tessera sanitaria.");
      return;
    }

                          dataNascita:p.data_nascita,catastale:c.catastale});
    const att = (d.codice_fiscale||"").trim().toUpperCase();
    if(att && att!==cf &&
       !confirm(`Il codice calcolato (${cf}) è diverso da quello già scritto (${att}).\n\nLo sostituisco?`)) return;

// Testo con "# titolo", "## sezione" e righe "- elenco"
function TestoModulo({testo}){
  return (testo||"").split(/\n\s*\n/).map((b,i)=>{
    const t=b.trim();
    if(t.startsWith("## ")) return <h4 key={i}>{t.slice(3)}</h4>;
    if(t.startsWith("# ")) return <h1 key={i}>{t.slice(2)}</h1>;
    const righe=t.split("\n");
    if(righe.every(r=>r.startsWith("- ")))
      return <ul key={i}>{righe.map((r,j)=><li key={j}>{r.slice(2)}</li>)}</ul>;
    return <div key={i}>{righe.map((r,j)=><p key={j}>{r}</p>)}</div>;
  });
}

/* ---------- area per firmare col dito o col mouse ---------- */
function AreaFirma({onCambia}){
  const tela = React.useRef(null);
  const attivo = React.useRef(false);
  const punti = React.useRef(0);

  useEffect(()=>{
    const cv=tela.current, r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
    const ctx=cv.getContext("2d");
    ctx.scale(dpr,dpr); ctx.lineWidth=2.2; ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.strokeStyle="#14211b";
  },[]);

  const pos = e => { const r=tela.current.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; };
  const giu = e => {
    e.preventDefault(); tela.current.setPointerCapture(e.pointerId); attivo.current=true;
    const ctx=tela.current.getContext("2d"), [x,y]=pos(e);
    ctx.beginPath(); ctx.moveTo(x,y);
  };
  const muovi = e => {
    if(!attivo.current) return;
    const ctx=tela.current.getContext("2d"), [x,y]=pos(e);
    ctx.lineTo(x,y); ctx.stroke(); punti.current++;
  };
  const su = () => {
    if(!attivo.current) return;
    attivo.current=false;
    // un semplice tocco non vale come firma
    onCambia(punti.current>15 ? tela.current.toDataURL("image/png") : null);
  };
  const cancella = () => {
    const cv=tela.current; cv.getContext("2d").clearRect(0,0,cv.width,cv.height);
    punti.current=0; onCambia(null);
  };

  return (
    <div>
      <canvas ref={tela} className="area-firma"
        onPointerDown={giu} onPointerMove={muovi} onPointerUp={su} onPointerCancel={su}/>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:6}}>
        <span style={{fontSize:13,color:"var(--testo-tenue)"}}>Firma qui sopra col dito o col mouse</span>
        <button className="btn secondario" style={{padding:"4px 12px"}} onClick={cancella}>Cancella</button>
      </div>
    </div>
  );
}

function FirmaModulo({token}){
  const [m,setM]=useState(null);
  const [errore,setErrore]=useState("");
  const [letto,setLetto]=useState(false);
  const [whatsapp,setWhatsapp]=useState(false);
  const [oppTs,setOppTs]=useState(false);
  const [ruolo,setRuolo]=useState("paziente");
  const [firmaNome,setFirmaNome]=useState("");
  const [firmaImg,setFirmaImg]=useState(null);
  const [invio,setInvio]=useState(false);
  const doc = React.useRef(null);

  useEffect(()=>{(async()=>{
    const {data,error} = await db.rpc("modulo_privacy",{p_token:token});
    if(error){ setErrore("Non riesco ad aprire il modulo: "+error.message); return; }
    setM(data);
    if(data?.stato==="da_firmare") setFirmaNome(data.dati_interessato?.nome||"");
  })()},[token]);

  async function firma(){
    setErrore(""); setInvio(true);
    const scelte = {presa_visione:letto, whatsapp, opposizione_ts:oppTs};
    const {data,error} = await db.rpc("firma_modulo_privacy",{
      p_token:token, p_firma_nome:firmaNome, p_firma_img:firmaImg,
      p_scelte:scelte, p_ruolo:ruolo, p_user_agent:navigator.userAgent});
    setInvio(false);
    if(error){ setErrore(error.message); return; }
    setM({...m, stato:"firmato", scelte, firma_nome:firmaNome.trim(), firma_img:firmaImg,
          firmatario_ruolo:ruolo, firmato_il:data.firmato_il, impronta:data.impronta,
          dati_interessato:data.dati_interessato});
    window.scrollTo(0,0);
  }

  const cornice = contenuto => (
    <>
      <header className="barra"><h1>Dott. Luca Di Russo · Modulo privacy</h1></header>
      <main className="pagina-firma">{contenuto}</main>
    </>
  );

  if(!m) return cornice(errore ? <div className="errore">{errore}</div>
                                : <p className="sottotitolo">Un attimo…</p>);
  if(m.stato!=="da_firmare" && m.stato!=="firmato") return cornice(
    <div className="scheda">
      <h2>Link non più valido</h2>
      <p className="sottotitolo" style={{margin:0}}>
        {m.stato==="scaduto" ? "Il link è scaduto." :
         m.stato==="annullato" ? "Questo link è stato annullato." : "Il link non esiste."}
        {" "}Chiedi al Dott. Di Russo di inviartene uno nuovo.
      </p>
    </div>
  );

  if(m.stato==="firmato") return cornice(
    <>
      <div className="scheda" style={{marginBottom:16,borderColor:"var(--verde-chiaro)"}}>
        <h2>Modulo firmato</h2>
        <p className="sottotitolo" style={{margin:"0 0 14px"}}>
          Firmato il {dataOra(m.firmato_il)}. Grazie, non devi fare altro.
          Se vuoi, conserva una copia: dalla finestra di stampa puoi anche salvarla in PDF.
        </p>
        <button className="btn" onClick={()=>stampaDocumento(doc.current,"Modulo privacy firmato")}>
          Stampa o salva copia
        </button>
      </div>
      <div className="scheda"><DocumentoFirmato ref={doc} m={m}/></div>
    </>
  );

  const di = m.dati_interessato||{};
  const pronto = letto && firmaNome.trim() && firmaImg;
  return cornice(
    <>
      <p className="sottotitolo">
        Leggi l'informativa, fai le tue scelte e firma in fondo alla pagina.
      </p>
      <div className="scheda" style={{marginBottom:16}}>
        <h3 className="titoletto">I tuoi dati</h3>
        <div className="riga-dato"><span>Nome e cognome</span><b>{di.nome||"—"}</b></div>
        <div className="riga-dato"><span>Codice fiscale</span><b>{di.codice_fiscale||"—"}</b></div>
        <div className="riga-dato"><span>Data di nascita</span><b>{di.data_nascita?dataIt(di.data_nascita):"—"}</b></div>
        <p className="nota" style={{marginTop:10}}>
          Se qualcosa non è corretto, avvisa il Dott. Di Russo prima di firmare.
        </p>
      </div>

      <div className="scheda testo-informativa" style={{marginBottom:16}}>
        <TestoModulo testo={m.testo}/>
      </div>

      <div className="scheda" style={{marginBottom:16}}>
        <h3 className="titoletto">Le tue scelte</h3>
        <label className="spunta">
          <input type="checkbox" checked={letto} onChange={e=>setLetto(e.target.checked)}/>
          <span><b>Dichiaro di aver letto e compreso l'informativa.</b> (obbligatoria)</span>
        </label>
        <label className="spunta">
          <input type="checkbox" checked={whatsapp} onChange={e=>setWhatsapp(e.target.checked)}/>
          <span>Acconsento a ricevere promemoria e comunicazioni tramite WhatsApp. (facoltativa)</span>
        </label>
        <label className="spunta">
          <input type="checkbox" checked={oppTs} onChange={e=>setOppTs(e.target.checked)}/>
          <span>Mi oppongo all'utilizzo delle mie spese sanitarie per la dichiarazione precompilata:
            saranno trasmesse al Sistema Tessera Sanitaria senza il mio codice fiscale. (facoltativa)</span>
        </label>
      </div>

      <div className="scheda" style={{marginBottom:16}}>
        <h3 className="titoletto">Firma</h3>
        <label className="spunta">
          <input type="radio" name="ruolo" checked={ruolo==="paziente"}
            onChange={()=>{setRuolo("paziente");setFirmaNome(di.nome||"")}}/>
          <span>Firmo per me stesso/a</span>
        </label>
        <label className="spunta">
          <input type="radio" name="ruolo" checked={ruolo==="genitore"}
            onChange={()=>{setRuolo("genitore");setFirmaNome("")}}/>
          <span>Firmo come genitore o tutore di un paziente minorenne</span>
        </label>
        <div style={{margin:"12px 0"}}>
          <label>{ruolo==="genitore"?"Nome e cognome del genitore o tutore":"Nome e cognome"}</label>
          <input value={firmaNome} onChange={e=>setFirmaNome(e.target.value)}/>
        </div>
        <AreaFirma onCambia={setFirmaImg}/>
        {errore && <div className="errore" style={{marginTop:14}}>{errore}</div>}
        <button className="btn" style={{marginTop:16,width:"100%",padding:"12px"}}
          disabled={!pronto||invio} onClick={firma}>
          {invio?"Invio…":"Firma e invia"}
        </button>
        {!pronto && (
          <p className="nota" style={{textAlign:"center",marginTop:8}}>
            Per inviare servono la conferma di lettura, il nome e la firma.
          </p>
        )}
      </div>
    </>
  );
}

/* ---------- riquadro privacy dentro la scheda paziente ---------- */
function PrivacyPaziente({pazienteId,utente,paziente,dati}){
  const [elenco,setElenco]=useState(null);
  const [errore,setErrore]=useState("");
  const [copia,setCopia]=useState(null);
  const [copiato,setCopiato]=useState(false);
  const doc = React.useRef(null);

  const carica = useCallback(async()=>{
    const {data,error} = await db.from("consensi")
      .select("id,token,versione,testo,creato_il,scade_il,firmato_il,firma_nome,firma_img,firmatario_ruolo,scelte,impronta,revocato_il,dati_interessato")
      .eq("paziente_id",pazienteId).order("creato_il",{ascending:false});
    if(error){ setErrore(error.message); return; }
    setErrore(""); setElenco(data||[]);
  },[pazienteId]);
  useEffect(()=>{carica()},[carica]);

  if(!elenco) return null;

  const firmato = elenco.find(c=>c.firmato_il && !c.revocato_il);
  const inAttesa = elenco.find(c=>!c.firmato_il && !c.revocato_il &&
                                 c.scade_il && new Date(c.scade_il)>new Date());

  async function prepara(){
    setErrore("");
    if(!(dati.codice_fiscale||"").trim() &&
       !confirm("Il paziente non ha ancora il codice fiscale in scheda. Nel modulo comparirà vuoto.\n\nPreparo il link lo stesso?")) return;
    const scade = new Date(Date.now()+GIORNI_VALIDITA_LINK*864e5).toISOString();
    const {error} = await db.from("consensi").insert({
      paziente_id:pazienteId, nutrizionista_id:utente.id,
      versione:VERSIONE_PRIVACY, testo:TESTO_PRIVACY, scade_il:scade});
    if(error){ setErrore("Link non creato: "+error.message); return; }
    carica();
  }

  async function annulla(c){
    if(!confirm("Annullo questo link? Il paziente non potrà più usarlo.")) return;
    const {error} = await db.from("consensi")
      .update({revocato_il:new Date().toISOString()}).eq("id",c.id);
    if(error){ setErrore(error.message); return; }
    carica();
  }

  const link = inAttesa ? `${location.origin}/?firma=${inAttesa.token}` : "";
  const saluto = (paziente.nome_proprio||"").trim() || "gentile paziente";
  const messaggio = `Buongiorno ${saluto}, per completare la sua scheda le chiedo di leggere e firmare il modulo privacy a questo link (valido ${GIORNI_VALIDITA_LINK} giorni):\n${link}\n\nDott. Luca Di Russo`;
  const cell = (dati.cellulare||"").replace(/\D/g,"");
  const numeroWa = cell ? (cell.startsWith("39")&&cell.length>10 ? cell : "39"+cell) : "";
  const linkWa = `https://wa.me/${numeroWa}?text=${encodeURIComponent(messaggio)}`;
  const linkMail = `mailto:${paziente.email||""}?subject=${encodeURIComponent("Modulo privacy - Dott. Luca Di Russo")}&body=${encodeURIComponent(messaggio)}`;

  async function copiaLink(){
    try{ await navigator.clipboard.writeText(link); setCopiato(true); setTimeout(()=>setCopiato(false),2000); }
    catch(e){ prompt("Copia il link:",link); }
  }

  return (
    <div className="scheda" style={{marginBottom:18}}>
      <h3 className="titoletto">Privacy</h3>
      {errore && <div className="errore">{errore}</div>}

      {firmato ? (
        <div style={{marginBottom:inAttesa?16:0}}>
          <p style={{margin:"0 0 8px"}}>
            <span className="pillola fatta">Firmato</span>{" "}
            il {dataOra(firmato.firmato_il)} da <b>{firmato.firma_nome}</b>
            {firmato.firmatario_ruolo==="genitore" && " (genitore o tutore)"}
          </p>
          <p style={{margin:"0 0 12px",fontSize:14}}>
            WhatsApp: <b>{firmato.scelte?.whatsapp?"sì":"no"}</b>
            {" · "}Sistema TS: {firmato.scelte?.opposizione_ts
              ? <b style={{color:"var(--ottone)"}}>si oppone, fattura senza codice fiscale</b>
              : <b>nessuna opposizione</b>}
          </p>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            <button className="btn secondario" onClick={()=>setCopia(firmato)}>Vedi copia firmata</button>
            {!inAttesa && <button className="btn secondario" onClick={prepara}>Nuovo modulo</button>}
          </div>
        </div>
      ) : !inAttesa && (
        <>
          <p style={{margin:"0 0 12px",color:"var(--testo-tenue)",fontSize:14}}>
            Nessun modulo firmato.
          </p>
          <button className="btn" onClick={prepara}>Prepara modulo privacy</button>
        </>
      )}

      {inAttesa && (
        <div>
          <p style={{margin:"0 0 10px"}}>
            <span className="pillola">In attesa di firma</span>{" "}
            <span style={{fontSize:14,color:"var(--testo-tenue)"}}>link valido fino al {dataOra(inAttesa.scade_il)}</span>
          </p>
          <input readOnly value={link} onFocus={e=>e.target.select()} style={{fontSize:13,marginBottom:10}}/>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            <a className="btn" href={linkWa} target="_blank" rel="noopener" style={{textDecoration:"none"}}>
              Invia su WhatsApp</a>
            <a className="btn secondario" href={linkMail} style={{textDecoration:"none"}}>Invia per email</a>
            <button className="btn secondario" onClick={copiaLink}>{copiato?"Copiato":"Copia link"}</button>
            <a className="btn secondario" href={link} target="_blank" rel="noopener" style={{textDecoration:"none"}}>
              Fai firmare qui</a>
            <button className="btn pericolo" onClick={()=>annulla(inAttesa)}>Annulla link</button>
          </div>
          {!cell && <p className="nota" style={{marginTop:8}}>
            Senza cellulare in scheda, WhatsApp ti farà scegliere il contatto a mano.</p>}
          <p className="nota" style={{marginTop:8}}>
            Quando il paziente ha firmato, riapri la scheda per vedere l'esito.</p>
        </div>
      )}

      {copia && (
        <div className="velo" onClick={()=>setCopia(null)}>
          <div className="foglio" onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginBottom:12}}>
              <button className="btn" onClick={()=>stampaDocumento(doc.current,"Modulo privacy - "+(copia.dati_interessato?.nome||""))}>
                Stampa (A5)</button>
              <button className="btn secondario" onClick={()=>setCopia(null)}>Chiudi</button>
            </div>
            <DocumentoFirmato ref={doc} m={copia}/>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App(){
  const [utente,setUtente]=useState(null);
  const [pronto,setPronto]=useState(false);
  const [sezione,setSezione]=useState("giornata");

  useEffect(()=>{(async()=>{
    const {data} = await db.auth.getSession();
    setUtente(data.session?.user||null);
    setPronto(true);
  })()},[]);

  const tokenFirma = new URLSearchParams(location.search).get("firma");
  if(tokenFirma) return <FirmaModulo token={tokenFirma}/>;

  if(SUPABASE_ANON_KEY.startsWith("INCOLLA")) return (
    <main style={{maxWidth:520,paddingTop:70}}>
      <h2>Manca la chiave di accesso al database</h2>
      <p className="sottotitolo">
        Apri il file index.html, cerca la riga SUPABASE_ANON_KEY e incolla al
        posto del segnaposto la chiave anon del progetto. La trovi su Supabase
        in Project Settings, sezione API, sotto "anon public".
      </p>
    </main>
  );

  if(!pronto) return <main><p className="sottotitolo">Un attimo…</p></main>;
  if(!utente) return <Accesso onEntrato={setUtente}/>;

  return (
    <>
      <header className="barra">
        <h1>NutriOra Studio</h1>
        <nav className="sezioni">
          <button className={sezione==="giornata"?"attiva":""}
            onClick={()=>setSezione("giornata")}>Giornata</button>
          <button className={sezione==="pazienti"?"attiva":""}
            onClick={()=>setSezione("pazienti")}>Pazienti</button>
          <button className={sezione==="sedi"?"attiva":""}
            onClick={()=>setSezione("sedi")}>Sedi</button>
          <button onClick={async()=>{await db.auth.signOut();setUtente(null)}}>Esci</button>
        </nav>
      </header>
      <main>
        {sezione==="giornata" && <Giornata utente={utente}/>}
        {sezione==="sedi" && <Sedi utente={utente}/>}
        {sezione==="pazienti" && <Pazienti utente={utente}/>}
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("radice")).render(<App/>);
</script>
</body>
