  td{padding:11px 10px;border-bottom:1px solid var(--riga);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .destra{text-align:right}
  .totali{

  }

  .totali .voce{font-size:13px;color:#9fb0a6}

  .totali .netto{margin-left:auto;text-align:right}

/* ============================================================
   ACCESSO
   ============================================================ */
function Accesso({onEntrato}){
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [errore,setErrore]=useState("");
  const [attesa,setAttesa]=useState(false);

  async function entra(){
    setAttesa(true); setErrore("");
    const {data,error} = await db.auth.signInWithPassword({email,password});
    setAttesa(false);
    if(error){ setErrore("Email o password non corrispondono."); return; }
    onEntrato(data.user);
  }

  return (
    <main style={{maxWidth:380,paddingTop:70}}>
      <h2>NutriOra Studio</h2>
      <p className="sottotitolo">Entra con le credenziali che usi su NutriOra.</p>
      <div className="scheda griglia">
        {errore && <div className="errore">{errore}</div>}
        <div>
          <label htmlFor="e">Email</label>
          <input id="e" type="email" value={email} autoComplete="username"
            onChange={e=>setEmail(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&entra()}/>
        </div>
        <div>
          <label htmlFor="p">Password</label>
          <input id="p" type="password" value={password} autoComplete="current-password"
            onChange={e=>setPassword(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&entra()}/>
        </div>
        <button className="btn" onClick={entra} disabled={attesa||!email||!password}>
          {attesa?"Un attimo…":"Entra"}
        </button>
      </div>
    </main>
  );
}

/* ============================================================
   SEDI
   ============================================================ */
function Sedi({utente}){
  const [sedi,setSedi]=useState([]);
  const [errore,setErrore]=useState("");
  const [inModifica,setInModifica]=useState(null);

  const carica = useCallback(async()=>{
    const {data,error} = await db.from("sedi").select("*").order("nome");
    if(error){ setErrore(error.message); return; }
    setSedi(data||[]);
  },[]);
  useEffect(()=>{carica()},[carica]);

  function nuova(){
    setInModifica({nome:"",tipo_costo:"giornata",commissione_pos:0,
      affitto_mensile:"",indirizzo:"",attiva:true});
  }

  async function salva(){
    const s = inModifica;
    const riga = {
      nome:s.nome.trim(),
      tipo_costo:s.tipo_costo,
      commissione_pos:Number(s.commissione_pos)||0,
      affitto_mensile:s.affitto_mensile===""?null:Number(s.affitto_mensile),
      indirizzo:s.indirizzo||null,
      attiva:s.attiva,
    };
    let error;
    if(s.id){
      ({error} = await db.from("sedi").update(riga).eq("id",s.id));
    }else{
      riga.nutrizionista_id = utente.id;
      ({error} = await db.from("sedi").insert(riga));
    }
    if(error){ setErrore(error.message); return; }
    setInModifica(null); setErrore(""); carica();
  }

  async function elimina(id){
    if(!confirm("Vuoi eliminare questa sede? Le giornate gia' registrate la useranno ancora, quindi se ne hai fatte l'eliminazione verra' rifiutata.")) return;
    const {error} = await db.from("sedi").delete().eq("id",id);
    if(error){ setErrore("Non si puo' eliminare: ci sono giornate collegate. Puoi metterla su Non attiva."); return; }
    carica();
  }

  if(inModifica) return (
    <>
      <h2>{inModifica.id?"Modifica sede":"Nuova sede"}</h2>
      <p className="sottotitolo">
        La commissione POS serve a calcolare il netto: mettila come la trovi
        sull'estratto del terminale, ad esempio 1,5 per l'1,5%.
      </p>
      {errore && <div className="errore">{errore}</div>}
      <div className="scheda griglia" style={{maxWidth:520}}>
        <div>
          <label>Nome</label>
          <input value={inModifica.nome}
            onChange={e=>setInModifica({...inModifica,nome:e.target.value})}/>
        </div>
        <div>
          <label>Indirizzo</label>
          <input value={inModifica.indirizzo||""}
            onChange={e=>setInModifica({...inModifica,indirizzo:e.target.value})}/>
        </div>
        <div>
          <label>Come paghi questa sede</label>
          <select value={inModifica.tipo_costo}
            onChange={e=>setInModifica({...inModifica,tipo_costo:e.target.value})}>
            <option value="giornata">Quota che scrivo giorno per giorno</option>
            <option value="mensile">Canone fisso mensile</option>
          </select>
        </div>
        {inModifica.tipo_costo==="mensile" && (
          <div>
            <label>Canone mensile in euro</label>
            <input type="number" step="0.01" value={inModifica.affitto_mensile||""}
              onChange={e=>setInModifica({...inModifica,affitto_mensile:e.target.value})}/>
          </div>
        )}
        <div>
          <label>Commissione POS in percentuale</label>
          <input type="number" step="0.001" value={inModifica.commissione_pos}
            onChange={e=>setInModifica({...inModifica,commissione_pos:e.target.value})}/>
        </div>
        <div>
          <label>
            <input type="checkbox" style={{width:"auto",marginRight:8}}
              checked={inModifica.attiva}
              onChange={e=>setInModifica({...inModifica,attiva:e.target.checked})}/>
            Ci ricevo ancora
          </label>
        </div>
        <div style={{display:"flex",gap:10}}>
          <button className="btn" onClick={salva} disabled={!inModifica.nome.trim()}>
            Salva sede
          </button>
          <button className="btn secondario" onClick={()=>{setInModifica(null);setErrore("")}}>
            Annulla
          </button>
        </div>
      </div>
    </>
  );

  return (
    <>
      <h2>Sedi</h2>
      <p className="sottotitolo">Gli studi e le palestre dove ricevi.</p>
      {errore && <div className="errore">{errore}</div>}
      <div className="scheda" style={{padding:0,overflow:"hidden"}}>
        {sedi.length===0 ? (
          <div className="vuoto">Non hai ancora nessuna sede. Aggiungi la prima.</div>
        ) : (
          <table>
            <thead><tr>
              <th>Sede</th>
              <th className="nascondi">Costo</th>
              <th className="destra">POS</th>
              <th></th>
            </tr></thead>
            <tbody>
              {sedi.map(s=>(
                <tr key={s.id}>
                  <td>
                    <div style={{fontWeight:500}}>{s.nome}</div>
                    {!s.attiva && <span className="pillola">Non attiva</span>}
                  </td>
                  <td className="nascondi">
                    {s.tipo_costo==="mensile"
                      ? `${eur(s.affitto_mensile)} al mese`
                      : "Quota giornaliera"}
                  </td>
                  <td className="destra num">{Number(s.commissione_pos)}%</td>
                  <td className="destra" style={{whiteSpace:"nowrap"}}>
                    <button className="btn secondario" style={{padding:"5px 10px"}}
                      onClick={()=>setInModifica(s)}>Modifica</button>
                    <button className="btn pericolo" style={{padding:"5px 10px",marginLeft:6}}
                      onClick={()=>elimina(s.id)}>Elimina</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
      <button className="btn" style={{marginTop:16}} onClick={nuova}>Aggiungi sede</button>
    </>
  );
}

/* ============================================================
   CERCA PAZIENTE
   ============================================================ */
function CercaPaziente({utente,onScelto}){
  const [testo,setTesto]=useState("");
  const [risultati,setRisultati]=useState([]);
  const [cercando,setCercando]=useState(false);

  useEffect(()=>{
    if(testo.trim().length<2){ setRisultati([]); return; }
    let annullato=false;
    const t=setTimeout(async()=>{
      setCercando(true);
      const {data} = await db.from("pazienti")
        .select("id,nome,email").ilike("nome",`%${testo.trim()}%`).limit(8);
      if(!annullato){ setRisultati(data||[]); setCercando(false); }
    },250);
    return ()=>{annullato=true;clearTimeout(t)};
  },[testo]);

  async function creaNuovo(){
    const nome = testo.trim();
    if(!nome) return;
    const {data,error} = await db.from("pazienti")
      .insert({nome,origine:"gestionale",nutrizionista_id:utente.id})
      .select("id,nome").single();
    if(error){ alert("Non sono riuscito a creare il paziente: "+error.message); return; }
    onScelto(data); setTesto(""); setRisultati([]);
  }

  return (
    <div>
      <label>Paziente</label>
      <input value={testo} placeholder="Scrivi il cognome o il nome"
        onChange={e=>setTesto(e.target.value)}/>
      {testo.trim().length>=2 && (
        <div className="risultati">
          {risultati.map(p=>(
            <button key={p.id} onClick={()=>{onScelto(p);setTesto("");setRisultati([])}}>
              {p.nome}
              {p.email && <span style={{color:"var(--testo-tenue)",fontSize:13}}> · {p.email}</span>}
            </button>
          ))}
          {!cercando && risultati.length===0 && (
            <button onClick={creaNuovo}>
              Nessuno trovato. Aggiungi <b>{testo.trim()}</b> come nuovo paziente
            </button>
          )}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   GIORNATA
   ============================================================ */
function Giornata({utente}){
  const [sedi,setSedi]=useState([]);
  const [data,setData]=useState(oggi());
  const [sedeId,setSedeId]=useState("");
  const [giornata,setGiornata]=useState(null);
  const [visite,setVisite]=useState([]);
  const [pagamenti,setPagamenti]=useState([]);
  const [errore,setErrore]=useState("");
  const [quota,setQuota]=useState("");

  const [paziente,setPaziente]=useState(null);
  const [prestazione,setPrestazione]=useState("controllo");
  const [importo,setImporto]=useState("");
  const [metodo,setMetodo]=useState("pos");
  const [fattura,setFattura]=useState(false);

  const sede = sedi.find(s=>s.id===sedeId);

  useEffect(()=>{(async()=>{
    const {data:d,error} = await db.from("sedi").select("*")
      .eq("attiva",true).order("nome");
    if(error){ setErrore(error.message); return; }
    setSedi(d||[]);
    if(d&&d.length&&!sedeId) setSedeId(d[0].id);
  })()},[]);

  const caricaGiornata = useCallback(async()=>{
    if(!sedeId||!data){ setGiornata(null); return; }
    const {data:g} = await db.from("giornate").select("*")
      .eq("data",data).eq("sede_id",sedeId).maybeSingle();
    setGiornata(g||null);
    setQuota(g? String(g.quota_studio) : "");
    if(!g){ setVisite([]); setPagamenti([]); return; }
    const [{data:v},{data:p}] = await Promise.all([
      db.from("visite").select("*, pazienti(nome)")
        .eq("giornata_id",g.id).order("creata_il"),
      db.from("pagamenti").select("*, pazienti(nome)")
        .eq("giornata_id",g.id).order("creato_il"),
    ]);
    setVisite(v||[]); setPagamenti(p||[]);
  },[data,sedeId]);
  useEffect(()=>{caricaGiornata()},[caricaGiornata]);

  async function apriGiornata(){
    const {data:g,error} = await db.from("giornate")
      .insert({data,sede_id:sedeId,quota_studio:0,nutrizionista_id:utente.id})
      .select("*").single();
    if(error){ setErrore(error.message); return null; }
    setGiornata(g); setQuota("0"); return g;
  }

  async function salvaQuota(){
    if(!giornata) return;
    const v = Number(quota)||0;
    const {error} = await db.from("giornate")
      .update({quota_studio:v}).eq("id",giornata.id);
    if(error){ setErrore(error.message); return; }
    setGiornata({...giornata,quota_studio:v});
  }

  async function aggiungi(){
    setErrore("");
    let g = giornata || await apriGiornata();
    if(!g) return;

    const {data:v,error:e1} = await db.from("visite").insert({
      paziente_id:paziente.id, giornata_id:g.id, data,
      prestazione, importo_dovuto: importo===""?null:Number(importo),
      nutrizionista_id:utente.id,
    }).select("*").single();
    if(e1){ setErrore(e1.message); return; }

    if(importo!=="" && Number(importo)>0){
      const perc = metodo==="pos" ? Number(sede?.commissione_pos||0) : 0;
      const {error:e2} = await db.from("pagamenti").insert({
        paziente_id:paziente.id, giornata_id:g.id, visita_id:v.id, data,
        importo:Number(importo), metodo, commissione_perc:perc,
        fattura_emessa:fattura, nutrizionista_id:utente.id,
      });
      if(e2){ setErrore(e2.message); return; }
    }

    setPaziente(null); setImporto(""); setFattura(false);
    setPrestazione("controllo");
    caricaGiornata();
  }

  async function togliVisita(v){
    if(!confirm("Tolgo questa riga e il pagamento collegato?")) return;
    await db.from("pagamenti").delete().eq("visita_id",v.id);
    await db.from("visite").delete().eq("id",v.id);
    caricaGiornata();
  }

  async function cambiaFattura(p){
    await db.from("pagamenti")
      .update({fattura_emessa:!p.fattura_emessa}).eq("id",p.id);
    caricaGiornata();
  }

  const incassato = pagamenti.reduce((t,p)=>t+Number(p.importo),0);
  const commissioni = pagamenti.reduce((t,p)=>t+Number(p.commissione_eur||0),0);
  const quotaNum = Number(giornata?.quota_studio||0);
  const netto = incassato - commissioni - quotaNum;

  const pagamentoDi = idVisita => pagamenti.find(p=>p.visita_id===idVisita);

  return (
    <>
      <h2>Giornata</h2>
      <p className="sottotitolo">
        Scegli il giorno e la sede, poi aggiungi i pazienti man mano.
      </p>
      {errore && <div className="errore">{errore}</div>}

      <div className="scheda" style={{marginBottom:18}}>
        <div style={{display:"flex",gap:14,flexWrap:"wrap",alignItems:"flex-end"}}>
          <div style={{flex:"1 1 150px"}}>
            <label>Data</label>
            <input type="date" value={data} onChange={e=>setData(e.target.value)}/>
          </div>
          <div style={{flex:"2 1 220px"}}>
            <label>Sede</label>
            <select value={sedeId} onChange={e=>setSedeId(e.target.value)}>
              {sedi.length===0 && <option value="">Nessuna sede attiva</option>}
              {sedi.map(s=><option key={s.id} value={s.id}>{s.nome}</option>)}
            </select>
          </div>
          <div style={{flex:"1 1 170px"}}>
            <label>Quota per lo studio</label>
            <input type="number" step="0.01" value={quota} placeholder="0,00"
              disabled={!giornata}
              onChange={e=>setQuota(e.target.value)} onBlur={salvaQuota}/>
          </div>
        </div>
        {sede?.tipo_costo==="mensile" && (
          <p style={{margin:"12px 0 0",fontSize:13,color:"var(--testo-tenue)"}}>
            Questa sede la paghi a canone fisso ({eur(sede.affitto_mensile)} al mese),
            quindi la quota giornaliera di norma resta a zero.
          </p>
        )}
      </div>

      <div className="scheda" style={{padding:0,overflow:"hidden",marginBottom:18}}>
        {visite.length===0 ? (
          <div className="vuoto">
            Nessun paziente registrato per questa giornata.
          </div>
        ) : (
          <table>
            <thead><tr>
              <th>Paziente</th>
              <th className="nascondi">Prestazione</th>
              <th className="destra">Incasso</th>
              <th className="nascondi destra">Commissione</th>
              <th>Fattura</th>
              <th></th>
            </tr></thead>
            <tbody>
              {visite.map(v=>{
                const p = pagamentoDi(v.id);
                return (
                  <tr key={v.id}>
                    <td style={{fontWeight:500}}>{v.pazienti?.nome||"—"}</td>
                    <td className="nascondi">{etichettaPrestazione(v.prestazione)}</td>
                    <td className="destra num">
                      {p ? eur(p.importo) : <span style={{color:"var(--testo-tenue)"}}>non pagata</span>}
                      {p && <div style={{fontSize:12,color:"var(--testo-tenue)"}}>
                        {p.metodo==="pos"?"POS":p.metodo==="contanti"?"Contanti":"Bonifico"}
                      </div>}
                    </td>
                    <td className="nascondi destra num" style={{color:"var(--ottone)"}}>
                      {p&&Number(p.commissione_eur)>0 ? "−"+eur(p.commissione_eur) : "—"}
                    </td>
                    <td>
                      {p ? (
                        <button className={"pillola "+(p.fattura_emessa?"fatta":"")}
                          style={{border:"none",cursor:"pointer"}}
                          onClick={()=>cambiaFattura(p)}>
                          {p.fattura_emessa?"Emessa":"Da fare"}
                        </button>
                      ) : "—"}
                    </td>
                    <td className="destra">
                      <button className="btn pericolo" style={{padding:"4px 9px"}}
                        onClick={()=>togliVisita(v)}>Togli</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      <div className="scheda">
        <h3 style={{margin:"0 0 14px",fontSize:16,fontWeight:600}}>Aggiungi un paziente</h3>
        {!paziente ? (
          <CercaPaziente utente={utente} onScelto={setPaziente}/>
        ) : (
          <div className="griglia">
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <b>{paziente.nome}</b>
              <button className="btn secondario" style={{padding:"3px 10px"}}
                onClick={()=>setPaziente(null)}>Cambia</button>
            </div>
            <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
              <div style={{flex:"1 1 160px"}}>
                <label>Prestazione</label>
                <select value={prestazione} onChange={e=>setPrestazione(e.target.value)}>
                  {PRESTAZIONI.map(([v,t])=><option key={v} value={v}>{t}</option>)}
                </select>
              </div>
              <div style={{flex:"1 1 130px"}}>
                <label>Quanto ha pagato</label>
                <input type="number" step="0.01" value={importo} placeholder="vuoto se non paga oggi"
                  onChange={e=>setImporto(e.target.value)}/>
              </div>
              <div style={{flex:"1 1 130px"}}>
                <label>Come</label>
                <select value={metodo} onChange={e=>setMetodo(e.target.value)}
                  disabled={importo===""}>
                  <option value="pos">POS</option>
                  <option value="contanti">Contanti</option>
                  <option value="bonifico">Bonifico</option>
                </select>
              </div>
            </div>
            <label>
              <input type="checkbox" style={{width:"auto",marginRight:8}}
                checked={fattura} disabled={importo===""}
                onChange={e=>setFattura(e.target.checked)}/>
              Fattura gia' emessa
            </label>
            <div>
              <button className="btn" onClick={aggiungi} disabled={!sedeId}>
                Aggiungi alla giornata
              </button>
            </div>
          </div>
        )}
      </div>

      <div className="totali">
        <div className="dentro">
          <div className="voce">Incassato<b className="num">{eur(incassato)}</b></div>
          <div className="voce">Commissioni POS<b className="num">−{eur(commissioni)}</b></div>
          <div className="voce">Quota studio<b className="num">−{eur(quotaNum)}</b></div>
          <div className="netto">
            <span>Ti resta</span>
            <b className="num">{eur(netto)}</b>
          </div>
        </div>
      </div>
    </>
  );
}

/* ============================================================
   PAZIENTI — elenco e scheda anagrafica
   Una sola anagrafica per Nutriora e Studio. I pazienti nati in
   Nutriora si vedono anche qui, ma i dati che Nutriora usa per i
   calcoli (sesso, data di nascita, email) si modificano solo la'.
   ============================================================ */
const CAMPI_DATI = [
  ["luogo_nascita","Luogo di nascita"],
  ["codice_fiscale","Codice fiscale"],
  ["cellulare","Cellulare"],
  ["telefono_fisso","Telefono fisso"],
  ["indirizzo","Indirizzo"],
  ["cap","CAP"],
  ["citta","Città"],
  ["provincia","Provincia"],
];

const etaDa = dn => {
  if(!dn) return null;
  const n=new Date(dn), o=new Date();
  let e=o.getFullYear()-n.getFullYear();
  if(o.getMonth()<n.getMonth()||(o.getMonth()===n.getMonth()&&o.getDate()<n.getDate())) e--;
  return e>=0&&e<130?e:null;
};
const dataIt = d => d ? new Date(d+"T00:00:00").toLocaleDateString("it-IT") : "—";
const nomeMetodo = m => m==="pos"?"POS":m==="contanti"?"Contanti":"Bonifico";

function Pazienti({utente}){
  const [testo,setTesto]=useState("");
  const [filtro,setFiltro]=useState("tutti");
  const [elenco,setElenco]=useState([]);
  const [carico,setCarico]=useState(true);
  const [errore,setErrore]=useState("");
  const [apertoId,setApertoId]=useState(null);
  const [creando,setCreando]=useState(false);
  const [nuovoNome,setNuovoNome]=useState("");

  const carica = useCallback(async()=>{
    setCarico(true);
    let q = db.from("pazienti").select("id,nome,email,origine").order("nome").limit(500);
    const t = testo.trim();
    if(t.length>=2) q = q.ilike("nome",`%${t}%`);
    if(filtro!=="tutti") q = q.eq("origine",filtro);
    const {data,error} = await q;
    if(error) setErrore(error.message); else { setErrore(""); setElenco(data||[]); }
    setCarico(false);
  },[testo,filtro]);
  useEffect(()=>{ const t=setTimeout(carica,250); return ()=>clearTimeout(t); },[carica]);

  async function nuovo(nomeDato){
    const nome = (nomeDato ?? testo).trim();
    if(!nome) return;
    const {data,error} = await db.from("pazienti")
      .insert({nome,origine:"gestionale",nutrizionista_id:utente.id})
      .select("id").single();
    if(error){ setErrore("Non sono riuscito a creare il paziente: "+error.message); return; }
    setTesto(""); setNuovoNome(""); setCreando(false); setApertoId(data.id);
  }

  if(apertoId) return (
    <SchedaPaziente id={apertoId} utente={utente}
      onChiudi={()=>{ setApertoId(null); carica(); }}/>
  );

  return (
    <>
      <div style={{display:"flex",alignItems:"flex-start",gap:12,flexWrap:"wrap"}}>
        <div style={{flex:"1 1 auto"}}>
          <h2>Pazienti</h2>
          <p className="sottotitolo">
            Tutti i tuoi pazienti, quelli dello studio e quelli che usano Nutriora.
          </p>
        </div>
        {!creando && (
          <button className="btn" onClick={()=>{setCreando(true);setNuovoNome(testo.trim())}}>
            + Nuovo paziente
          </button>
        )}
      </div>
      {errore && <div className="errore">{errore}</div>}

      {creando && (
        <div className="scheda" style={{marginBottom:18}}>
          <h3 className="titoletto">Nuovo paziente</h3>
          <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end"}}>
            <div style={{flex:"3 1 240px"}}>
              <label>Nome e cognome</label>
              <input autoFocus value={nuovoNome} placeholder="Es. Mario Rossi"
                onChange={e=>setNuovoNome(e.target.value)}
                onKeyDown={e=>{ if(e.key==="Enter") nuovo(nuovoNome); }}/>
            </div>
            <button className="btn" disabled={!nuovoNome.trim()} onClick={()=>nuovo(nuovoNome)}>
              Crea e apri la scheda
            </button>
            <button className="btn secondario" onClick={()=>{setCreando(false);setNuovoNome("")}}>
              Annulla
            </button>
          </div>
          <p className="nota" style={{marginTop:10}}>
            Il resto dell'anagrafica lo compili nella scheda che si apre subito dopo.
          </p>
        </div>
      )}

      <div className="scheda" style={{marginBottom:18}}>
        <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end"}}>
          <div style={{flex:"3 1 240px"}}>
            <label>Cerca</label>
            <input value={testo} placeholder="Nome o cognome"
              onChange={e=>setTesto(e.target.value)}/>
          </div>
          <div style={{flex:"1 1 150px"}}>
            <label>Mostra</label>
            <select value={filtro} onChange={e=>setFiltro(e.target.value)}>
              <option value="tutti">Tutti</option>
              <option value="gestionale">Solo studio</option>
              <option value="nutriora">Solo Nutriora</option>
            </select>
          </div>
        </div>
        {testo.trim().length>=2 && !carico && elenco.length===0 && (
          <button className="btn secondario" style={{marginTop:12}} onClick={()=>nuovo()}>
            Aggiungi «{testo.trim()}» come nuovo paziente
          </button>
        )}
      </div>

      <div className="scheda" style={{padding:0,overflow:"hidden"}}>
        {elenco.length===0 ? (
          <div className="vuoto">{carico?"Un attimo…":"Nessun paziente trovato."}</div>
        ) : (
          <table>
            <thead><tr>
              <th>Paziente</th>
              <th className="nascondi">Email</th>
              <th>Dove</th>
            </tr></thead>
            <tbody>
              {elenco.map(p=>(
                <tr key={p.id} className="cliccabile" onClick={()=>setApertoId(p.id)}>
                  <td style={{fontWeight:500}}>{p.nome}</td>
                  <td className="nascondi" style={{color:"var(--testo-tenue)"}}>{p.email||"—"}</td>
                  <td>
                    <span className={"pillola "+(p.origine==="nutriora"?"fatta":"")}>
                      {p.origine==="nutriora"?"Nutriora":"Studio"}
                    </span>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </>
  );
}

function SchedaPaziente({id,utente,onChiudi}){
  const [p,setP]=useState(null);
  const [d,setD]=useState({});
  const [visite,setVisite]=useState([]);
  const [pagamenti,setPagamenti]=useState([]);
  const [errore,setErrore]=useState("");
  const [salvando,setSalvando]=useState(false);
  const [salvato,setSalvato]=useState(false);

  useEffect(()=>{(async()=>{
    const [r1,r2,r3,r4] = await Promise.all([
      db.from("pazienti").select("id,nome,email,sesso,data_nascita,origine").eq("id",id).single(),
      db.from("dati_paziente").select("*").eq("paziente_id",id).maybeSingle(),
      db.from("visite").select("id,data,prestazione,giornate(sedi(nome))")
        .eq("paziente_id",id).order("data",{ascending:false}),
      db.from("pagamenti").select("id,visita_id,importo,metodo,fattura_emessa")
        .eq("paziente_id",id),
    ]);
    if(r1.error){ setErrore(r1.error.message); return; }
    setP(r1.data); setD(r2.data||{});
    setVisite(r3.data||[]); setPagamenti(r4.data||[]);
  })()},[id]);

  if(!p) return (
    <>
      <button className="btn secondario" onClick={onChiudi}>← Pazienti</button>
      {errore ? <div className="errore" style={{marginTop:16}}>{errore}</div>
              : <p className="sottotitolo" style={{marginTop:16}}>Un attimo…</p>}
    </>
  );

  const daStudio = p.origine!=="nutriora";
  const cambiaP = (k,v)=>{ setP({...p,[k]:v}); setSalvato(false); };
  const cambiaD = (k,v)=>{ setD({...d,[k]:v}); setSalvato(false); };

  async function salva(){
    setErrore(""); setSalvato(false);
    const nome = (p.nome||"").trim();
    if(!nome){ setErrore("Il nome non può restare vuoto."); return; }
    setSalvando(true);

    const agg = {nome};
    if(daStudio){
      agg.sesso = p.sesso||null;
      agg.data_nascita = p.data_nascita||null;
      agg.email = (p.email||"").trim().toLowerCase()||null;
      if(agg.email){
        const {data:altri} = await db.from("pazienti").select("nome,origine")
          .eq("email",agg.email).neq("id",id).limit(1);
        if(altri&&altri.length){
          setErrore(`Questa email appartiene già a ${altri[0].nome}`+
            (altri[0].origine==="nutriora"?" in Nutriora":"")+
            ". Probabilmente è la stessa persona registrata due volte: non salvo, per non creare un doppione.");
          setSalvando(false); return;
        }
      }
    }
    const {error:e1} = await db.from("pazienti").update(agg).eq("id",id);
    if(e1){ setErrore("Anagrafica non salvata: "+e1.message); setSalvando(false); return; }

    const riga = {paziente_id:id, nutrizionista_id:utente.id,
                  aggiornato_il:new Date().toISOString()};
    CAMPI_DATI.forEach(([k])=>{
      let v = (d[k]??"").toString().trim();
      if(k==="codice_fiscale"||k==="provincia") v = v.toUpperCase();
      riga[k] = v||null;
    });
    const {error:e2} = await db.from("dati_paziente").upsert(riga,{onConflict:"paziente_id"});
    if(e2){ setErrore("Contatti e residenza non salvati: "+e2.message); setSalvando(false); return; }

    setP({...p,...agg}); setD({...d,...riga});
    setSalvando(false); setSalvato(true);
  }

  async function elimina(){
    const n = visite.length;
    const msg = `Elimino ${p.nome} dall'anagrafica?`+
      (n ? `\n\nVerranno cancellate anche ${n} ${n===1?"visita":"visite"} con i pagamenti collegati: gli incassi di quelle giornate cambieranno.` : "")+
      "\n\nNon si può annullare.";
    if(!confirm(msg)) return;
    const e1 = (await db.from("pagamenti").delete().eq("paziente_id",id)).error;
    const e2 = e1 || (await db.from("visite").delete().eq("paziente_id",id)).error;
    const e3 = e2 || (await db.from("pazienti").delete().eq("id",id)).error;
    if(e3){ setErrore("Eliminazione non riuscita: "+e3.message); return; }
    onChiudi();
  }

  const pagDi = vid => pagamenti.find(x=>x.visita_id===vid);
  const totPagato = pagamenti.reduce((t,x)=>t+Number(x.importo),0);
  const daFatturare = pagamenti.filter(x=>!x.fattura_emessa).length;
  const eta = etaDa(p.data_nascita);

  const campo = (k,t,extra={}) => (
    <div key={k}>
      <label>{t}</label>
      <input value={d[k]??""} onChange={e=>cambiaD(k,e.target.value)} {...extra}/>
    </div>
  );

  return (
    <>
      <button className="btn secondario" onClick={onChiudi}>← Pazienti</button>
      <div style={{display:"flex",alignItems:"baseline",gap:12,flexWrap:"wrap",margin:"18px 0 4px"}}>
        <h2 style={{margin:0}}>{p.nome}</h2>
        <span className={"pillola "+(daStudio?"":"fatta")}>{daStudio?"Studio":"Nutriora"}</span>
      </div>
      <p className="sottotitolo">
        {eta!==null ? `${eta} anni · ` : ""}
        {visite.length} {visite.length===1?"visita":"visite"} · pagato in totale {eur(totPagato)}
        {daFatturare>0 && <span style={{color:"var(--ottone)"}}> · {daFatturare} {daFatturare===1?"fattura":"fatture"} da fare</span>}
      </p>
      {errore && <div className="errore">{errore}</div>}

      <div className="scheda" style={{marginBottom:18}}>
        <h3 className="titoletto">Anagrafica</h3>
        <div className="campi">
          <div>
            <label>Nome e cognome</label>
            <input value={p.nome||""} onChange={e=>cambiaP("nome",e.target.value)}/>
          </div>
          <div>
            <label>Sesso</label>
            <select value={p.sesso||""} disabled={!daStudio}
              onChange={e=>cambiaP("sesso",e.target.value)}>
              <option value="">—</option>
              <option value="F">Femmina</option>
              <option value="M">Maschio</option>
            </select>
          </div>
          <div>
            <label>Data di nascita</label>
            <input type="date" value={p.data_nascita||""} disabled={!daStudio}
              onChange={e=>cambiaP("data_nascita",e.target.value)}/>
          </div>
          {campo("luogo_nascita","Luogo di nascita")}
          {campo("codice_fiscale","Codice fiscale",{maxLength:16,style:{textTransform:"uppercase"}})}
        </div>

        <h3 className="titoletto" style={{marginTop:22}}>Contatti</h3>
        <div className="campi">
          {campo("cellulare","Cellulare",{type:"tel"})}
          {campo("telefono_fisso","Telefono fisso",{type:"tel"})}
          <div>
            <label>Email</label>
            <input type="email" value={p.email||""} disabled={!daStudio}
              onChange={e=>cambiaP("email",e.target.value)}/>
          </div>
        </div>

        <h3 className="titoletto" style={{marginTop:22}}>Residenza (per la fattura)</h3>
        <div className="campi">
          <div style={{gridColumn:"1 / -1"}}>
            <label>Indirizzo</label>
            <input value={d.indirizzo??""} onChange={e=>cambiaD("indirizzo",e.target.value)}/>
          </div>
          {campo("cap","CAP",{inputMode:"numeric",maxLength:5})}
          {campo("citta","Città")}
          {campo("provincia","Provincia",{maxLength:2,style:{textTransform:"uppercase"}})}
        </div>

        {!daStudio && (
          <p className="nota">
            Sesso, data di nascita ed email si modificano da Nutriora: li usa per i
            calcoli e l'email è la chiave con cui ritrova pasti e misurazioni.
          </p>
        )}

        <div style={{display:"flex",gap:12,alignItems:"center",marginTop:20,flexWrap:"wrap"}}>
          <button className="btn" onClick={salva} disabled={salvando}>
            {salvando?"Salvo…":"Salva"}
          </button>
          {salvato && <span style={{color:"var(--verde)",fontSize:14}}>Salvato</span>}
        </div>
      </div>

      <div className="scheda" style={{padding:0,overflow:"hidden",marginBottom:18}}>
        <h3 className="titoletto" style={{padding:"18px 20px 0"}}>Visite e pagamenti</h3>
        {visite.length===0 ? (
          <div className="vuoto">Nessuna visita registrata.</div>
        ) : (
          <table>
            <thead><tr>
              <th>Data</th>
              <th className="nascondi">Sede</th>
              <th className="nascondi">Prestazione</th>
              <th className="destra">Pagato</th>
              <th>Fattura</th>
            </tr></thead>
            <tbody>
              {visite.map(v=>{
                const x = pagDi(v.id);
                return (
                  <tr key={v.id}>
                    <td className="num">{dataIt(v.data)}</td>
                    <td className="nascondi">{v.giornate?.sedi?.nome||"—"}</td>
                    <td className="nascondi">{etichettaPrestazione(v.prestazione)}</td>
                    <td className="destra num">
                      {x ? <>{eur(x.importo)}<div style={{fontSize:12,color:"var(--testo-tenue)"}}>{nomeMetodo(x.metodo)}</div></>
                         : <span style={{color:"var(--testo-tenue)"}}>non pagata</span>}
                    </td>
                    <td>{x ? <span className={"pillola "+(x.fattura_emessa?"fatta":"")}>
                      {x.fattura_emessa?"Emessa":"Da fare"}</span> : "—"}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {daStudio ? (
        <button className="btn pericolo" onClick={elimina}>Elimina paziente</button>
      ) : (
        <p className="nota">
          Questo paziente usa Nutriora: per eliminarlo del tutto fallo da Nutriora,
          che cancella anche pasti, misurazioni e BIA.
        </p>
      )}
    </>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App(){
  const [utente,setUtente]=useState(null);
  const [pronto,setPronto]=useState(false);
  const [sezione,setSezione]=useState("giornata");

  useEffect(()=>{(async()=>{
    const {data} = await db.auth.getSession();
    setUtente(data.session?.user||null);
    setPronto(true);
  })()},[]);

  if(SUPABASE_ANON_KEY.startsWith("INCOLLA")) return (
    <main style={{maxWidth:520,paddingTop:70}}>
      <h2>Manca la chiave di accesso al database</h2>
      <p className="sottotitolo">
        Apri il file index.html, cerca la riga SUPABASE_ANON_KEY e incolla al
        posto del segnaposto la chiave anon del progetto. La trovi su Supabase
        in Project Settings, sezione API, sotto "anon public".
      </p>
    </main>
  );

  if(!pronto) return <main><p className="sottotitolo">Un attimo…</p></main>;
  if(!utente) return <Accesso onEntrato={setUtente}/>;

  return (
    <>
      <header className="barra">
        <h1>NutriOra Studio</h1>
        <nav className="sezioni">
          <button className={sezione==="giornata"?"attiva":""}
            onClick={()=>setSezione("giornata")}>Giornata</button>
          <button className={sezione==="pazienti"?"attiva":""}
            onClick={()=>setSezione("pazienti")}>Pazienti</button>
          <button className={sezione==="sedi"?"attiva":""}
            onClick={()=>setSezione("sedi")}>Sedi</button>
          <button onClick={async()=>{await db.auth.signOut();setUtente(null)}}>Esci</button>
        </nav>
      </header>
      <main>
        {sezione==="giornata" && <Giornata utente={utente}/>}
        {sezione==="sedi" && <Sedi utente={utente}/>}
        {sezione==="pazienti" && <Pazienti utente={utente}/>}
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("radice")).render(<App/>);
</script>
</body>
</html>
